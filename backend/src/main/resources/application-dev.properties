# Arbeitsplatz: bequemes Standardpasswort, damit niemand vor dem ersten Start etwas setzen muss.
# ADMIN_INITIAL_PASSWORD aus der Umgebung gewinnt trotzdem — sonst haette, wer deployment/.env pflegt
# und mit docker-compose.dev.yml startet, ein anderes Kennwort als gedacht (gemessen 05.09.).
# Auf der VM laeuft das Profil prod — dort gibt es diesen Standard bewusst nicht.
app.admin-initial-password=${ADMIN_INITIAL_PASSWORD:admin}
logging.level.org.flywaydb=INFO
# Arbeitsplatz/Pipeline: der Beispielwert aus .env.example darf hier durchgehen (SICHERHEIT-6).
app.admin-allow-placeholder-password=true
