# Grundeinstellungen. Alles, was sich zwischen Arbeitsplatz, Pipeline und VM unterscheidet,
# kommt aus Umgebungsvariablen — im Programm steht keine feste Adresse.
spring.application.name=stundenplanung
spring.profiles.default=dev
server.port=8080

# Standard zeigt auf die Compose-Datenbank aus deployment/docker-compose.dev.yml (Port 15432).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/timetable}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tt}

# Das Schema kommt ausschliesslich aus den Flyway-Skripten unter db/migration.
# "validate" prueft beim Start nur, ob die Entities zu den Tabellen passen, und aendert nichts.
spring.jpa.hibernate.ddl-auto=validate

# Lazy geladene Mengen (Teacher.subjectIds, preferredTimeslotIds, blockedTimeslotIds) holt Hibernate damit in
# Bloecken per IN-Abfrage statt einzeln je Lehrkraft. Ohne die Zeile kostet ein GET /api/draft bei 24
# Lehrkraeften 25 statt 2 Abfragen und ein GET /api/teachers 73 statt 4 (Befund BACKEND-4, 05.09.).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# Erstes Konto beim allerersten Start; Profil dev setzt einen Standard, prod verlangt die Variable.
app.admin-initial-password=${ADMIN_INITIAL_PASSWORD:}
# Der Beispielwert "bitte-aendern" aus deployment/.env.example darf nur am Arbeitsplatz und in der
# Pipeline durchgehen; im Betrieb bricht AdminBootstrap damit ab (Befund SICHERHEIT-6, 05.09.).
app.admin-allow-placeholder-password=${ADMIN_ALLOW_PLACEHOLDER_PASSWORD:false}

# Rechenzeit fuer Solver-Laeufe OHNE eigene Angabe. SolverRunner gibt jedem Lauf die Rechenzeit aus
# SystemConfig.maxSolveSeconds mit (SolverConfigOverride), und die ERSETZT diesen Wert — sie wird nicht
# von ihm gedeckelt (gemessen 05.09., Modul solver: Basis 2 s, Override 6 s -> Lauf 6,2 s). Die Obergrenze
# fuer maxSolveSeconds ist also allein die Validierung von PUT /api/config.
timefold.solver.termination.spent-limit=60s
timefold.solver-manager.parallel-solver-count=1

# Rechenzeit fuer den Plan des Beispielbestands (POST /api/sample-data, E-46). Zehn Sekunden sind
# gemessen: 0 harte Konflikte, 4 von 360 Stunden offen. Der Aufruf blockiert so lange — die Checkliste
# raeumt D-1 dafuer bis zu 30 Sekunden ein.
app.sample-data.solve-seconds=${SAMPLE_DATA_SOLVE_SECONDS:10}

# Lebensdauer einer Sitzung (ISO-8601-Dauer). Ursprung waren 12 Stunden (api.md Auth-Fluss 5); seit dem
# NACHTRAG 05.09. dreissig Tage, weil die Web-App die Sitzung im Browser behaelt (localStorage) und ein
# Neuladen nicht mehr abmelden soll. Kuerzer stellen: z. B. PT12H.
app.auth.token-ttl=${AUTH_TOKEN_TTL:P30D}

# Aufraeumen abgelaufener Sitzungen (Modul auth): taeglich 03:15 Uhr. Nur zum Pruefen aendern.
app.token-cleanup-cron=${TOKEN_CLEANUP_CRON:0 15 3 * * *}
