# Pipeline: die Datenbank ist der GitLab-Dienst postgres bzw. die Wegwerf-Datenbank aus
# scripts/ci-backend-test.sh. Kein Standardwert — fehlt die Variable, soll der Lauf sofort scheitern.
spring.datasource.url=${SPRING_DATASOURCE_URL}
app.admin-initial-password=${ADMIN_INITIAL_PASSWORD:admin}

# Rechenzeit fuer den Plan des Beispielbestands (POST /api/sample-data). Im Betrieb sind es zehn
# Sekunden; in der Pipeline soll SampleDataIT belegen, DASS der Plan entsteht, nicht wie gut er ist —
# jede der Testmethoden laedt den Bestand mindestens einmal.
app.sample-data.solve-seconds=3
# Arbeitsplatz/Pipeline: der Beispielwert aus .env.example darf hier durchgehen (SICHERHEIT-6).
app.admin-allow-placeholder-password=true
