              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: urn:pushnpull:problem:master-data-incomplete
                title: Grunddaten unvollständig
                status: 409
                detail: Vor der Berechnung fehlen Angaben.
                missing:
                  - Klasse 9c hat kein Fach
    delete:
      tags: [Entwurf]
      operationId: cancelSolve
      summary: Berechnung vorzeitig beenden
      description: Beendet den laufenden Solver; das bis dahin beste Ergebnis wird in den Entwurf übernommen (T-W8.1). Läuft nichts, ändert sich nichts — trotzdem 202.
      x-role: PLANNING
      responses:
        '202':
          description: Abbruch angestoßen; Stand über GET /api/draft
        '401':
