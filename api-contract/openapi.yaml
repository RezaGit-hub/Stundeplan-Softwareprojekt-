                      - { date: '2026-09-21', timeslotId: 4, day: MO, position: 4, lessonId: 5, classId: 2, classShort: 8b, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 2, roomShort: R204, kind: REGULAR, original: null, reasons: [], exceptionId: null }
