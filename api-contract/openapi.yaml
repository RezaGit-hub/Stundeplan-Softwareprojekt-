openapi: 3.1.0

info:
  title: Stundenplanung — REST-API
  version: 1.4.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Vertrag der REST-API der Stundenplanung (Gruppe WSP3_1 „PushnPull", Anwendungspartner adesso).
    Diese Datei ist die einzige Wahrheit der API: Endpunkt bauen heißt zuerst hier ändern, dann
    `npm run lint`, dann Prism prüfen, dann den Controller schreiben.

    **Stand v1 (04.09.2026, Vollausbau).** v0 = Erreichbarkeit, Anmeldung, Konten, Grunddaten
    (Lehrkräfte, Fächer, Räume, Klassen), Stundenraster, Regelwerk, Konfiguration, Beispieldaten.
    v1 ergänzt additiv: aktiver Plan, aufgelöste Kalenderwoche (vier Sichten, eigene Woche der
    Lehrkraft), Entwurf mit Handaufbau, Berechnung (asynchron) und Annehmen, Änderungsereignisse,
    vertretungsbedürftige Stunden, Vertretungsoptionen, datierte Ausnahmen, Änderungsverlauf,
    unterrichtsfreie Zeiträume. Kann-Felder (`classId` beim Berechnen, `validFrom`/`validUntil` beim
    Annehmen) sind optional und mit E-40 markiert.

    **Gültigkeitszeitraum (1.4.0, #115).** Ein angenommener Plan hat einen Zeitraum
    `[validFrom, validUntil]`, beide Grenzen einschließlich; `validFrom: null` heißt „ab dem Tag der
    Annahme", `validUntil: null` heißt „unbegrenzt". Es darf **mehrere aktive Pläne** geben, solange
    sich ihre Zeiträume nicht überschneiden — `GET /api/timetables` listet sie, `GET /api/timetable`
    liefert den, der **heute** gilt (sonst den mit dem nächsten künftigen Beginn, sonst `id: null`). Was sich gegenüber v0 geändert hat und wie ein Modul den
    Vertrag erweitern darf, steht in `docs/VERTRAG.md`.

    **Konventionen.**
    - Basis `/api`, keine Versionierung im Pfad.
    - JSON, Feldnamen camelCase, Bezeichner englisch.
    - Datum `yyyy-MM-dd`, Uhrzeit `HH:mm`, Wochentag `MO`…`SA`.
    - IDs `integer` / `int64`, vom Server vergeben.
    - Listen sind unpaginiert (Schulgröße); Ausnahme wird erst `/changelog` in v1.
    - DTOs sind flach und tragen ID **und** Anzeigetext (`teacherId` und `teacherShort`), damit Web
      und App nichts nachladen müssen.
    - Alle Texte für Menschen (`title`, `detail`, `message`, `label`) sind deutsch in Schulsprache.
    - Fehler sind immer `application/problem+json` nach RFC 9457 mit
      `type: urn:pushnpull:problem:<slug>`.
    - **Konflikte und Warnungen sind Daten, keine Fehler**: sie stehen als `warnings[]` bzw.
      `conflicts[]` in 200/201-Antworten. Speichern wird nie blockiert.
    - Schreibende Aufrufe auf den Entwurf antworten während einer Berechnung mit 409 `solving`;
      `POST /api/draft/solve` und `DELETE /api/draft/solve` antworten 202 ohne Body, den Stand
      liefert `GET /api/draft`.

    **Rollen.** `x-role` an jeder Operation ist eine Lesehilfe: `ANY` = jedes angemeldete Konto
    (bzw. ohne Token, wo `security: []` steht), `PLANNING` = nur die Planung, `TEACHER` = nur
    Lehrkraft-Endpunkte, `STUDENT` = Klassenkonto. Serverseitig gilt: `GET /api/health` und
    `POST /api/auth/login` ohne Token; `DELETE /api/auth/token`, `GET /api/me`, `GET /api/timegrid`
    und `GET /api/me/class-week` für jedes angemeldete Konto; das übrige `/api/me/**`
    (`PUT /api/me/password`, `PUT /api/me/tour`, `GET /api/me/timetable/week`) für `PLANNING` und `TEACHER`; alles
    Übrige unter `/api/**` verlangt die Rolle `PLANNING` (E-45) — eine Lehrkraft bekommt dort 403,
    auch bei direkter Anfrage.

    **Schülersicht (E-50, NACHTRAG 05.09.).** Ein Klassenkonto (Rolle `STUDENT`, Spalte
    `user_account.class_id` aus der Migration `V7`) liest genau sechs Endpunkte: `GET /api/health`,
    `POST /api/auth/login`, `DELETE /api/auth/token`, `GET /api/me`, `GET /api/timegrid` und
    `GET /api/me/class-week`. Alles andere ist 403 — auch `GET /api/me/timetable/week` und
    `PUT /api/me/password`. Die Klasse kommt aus dem Token, nie aus einem Parameter. Die Antwort
    von `GET /api/me/class-week` ist **serverseitig gefiltert**: `reasons` ist immer leer und
    `original` trägt nur Kürzel, Datum und Position. Begründung und Quellen:
    `07-Konzept/recherche/sammelzugang-schueler.md`, Abschnitt „Bewertung"; Regeln ST-1 bis ST-5
    in `docs/VERTRAG.md`, Abschnitt `students`.

    **Beispiele.** Jede 2xx-Antwort hat ein `example` — davon lebt der Prism-Mock. Die Werte sind der
    Testdatenbestand des Pflichtenhefts: Lehrkräfte Meyer, Schulz, Weber; Klassen 7a, 8b, 9c; Räume
    R101, R204, P1; Raster Mo–Fr, sechs Stunden, große Pause nach der zweiten.

servers:
  - url: /
    description: |
      Gleiche Herkunft wie die Web-App — nginx (Betrieb) bzw. der Vite-Proxy (Entwicklung) leiten
      /api an das Backend weiter. Die Basis /api steht deshalb in jedem Pfad und nicht im Server:
      Prism blendet einen Server-Pfad aus, der Mock würde sonst /health statt /api/health bedienen.
      Kein absoluter Server-Eintrag, damit im Vertrag keine Adresse verdrahtet ist.

security:
  - bearerToken: []

tags:
  - name: Erreichbarkeit
    description: Health-Endpunkt für Web-App und Android-App (A-3).
  - name: Anmeldung
    description: Anmelden, Abmelden, eigene Identität, eigenes Passwort.
  - name: Konten
    description: Benutzerkonten der Planung und der Lehrkräfte.
  - name: Lehrkräfte
    description: Grunddaten der Lehrkräfte inklusive Deputat, Fächern und Sperrzeiten.
  - name: Fächer
    description: Grunddaten der Fächer inklusive geforderter Raumart und Farbe.
  - name: Räume
    description: Grunddaten der Räume inklusive Raumart.
  - name: Klassen
    description: Grunddaten der Klassen und ihre Fächerliste (Wochenstunden je Fach und Lehrkraft).
  - name: Stundenraster
    description: Zeitfenster je Wochentag inklusive Pausen.
  - name: Regelwerk
    description: Regeln der Planung (Wert, hart oder weich, Gewicht, aktiv).
  - name: Konfiguration
    description: Systemkonfiguration und Beispieldatenbestand.
  - name: Plan
    description: Aktiver Regelplan und aufgelöste Kalenderwochen in vier Sichten (W-4).
  - name: Entwurf
    description: Der eine Entwurf — Handaufbau, Berechnung, Festlegung, Annehmen (W-3, W-8, W-9).
  - name: Änderungen
    description: Ausfall einer Lehrkraft, Sperrung eines Raums, Zusatzstunde (W-5).
  - name: Vertretung
    description: Vertretungsbedürftige Stunden, freie Lehrkräfte und Räume, datierte Ausnahmen (W-6).
  - name: Verlauf
    description: Änderungsverlauf, nur lesend (W-7).
  - name: Ferien
    description: Unterrichtsfreie Zeiträume (Kann, E-13).
  - name: Schülersicht
    description: Wochenplan der eigenen Klasse für ein Klassenkonto — datensparsam (E-50).
  - name: Sicherung
    description: Grunddaten als Dokument aus- und wieder einspielen (Format-Version 1).

paths:
  /api/health:
    get:
      tags: [Erreichbarkeit]
      operationId: health
      summary: Erreichbarkeit prüfen
      description: Ohne Token erreichbar. Die Android-App prüft damit die eingetragene Serveradresse (A-3).
      security: []
      x-role: ANY
      responses:
        '200':
          description: Server erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
              example:
                status: UP
                schoolName: Gymnasium Musterstadt

  /api/auth/login:
    post:
      tags: [Anmeldung]
      operationId: login
      summary: Anmelden
      description: |
        Prüft Benutzername und Passwort und gibt ein Zugriffsmerkmal (Token) zurück. Der Client sendet
        es danach als `Authorization: Bearer <token>`. Das Token läuft nach zwölf Stunden ab.
      security: []
      x-role: ANY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin
      responses:
        '200':
          description: Anmeldung erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: 8Ck2Qk9wZ1tR7mS0vJ4bLxH6nP3dY5aUgE2fT1oI9cM
                role: PLANNING
                displayName: admin
                teacherId: null
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'

  /api/auth/token:
    delete:
      tags: [Anmeldung]
      operationId: logout
      summary: Abmelden
      description: Löscht das eigene Token serverseitig. Danach führt jede weitere Anfrage zu 401.
      x-role: ANY
      responses:
        '204':
          description: abgemeldet
        '401':
          $ref: '#/components/responses/Unauthenticated401'

  /api/me:
    get:
      tags: [Anmeldung]
      operationId: me
      summary: Eigene Identität
      description: |
        Liefert das angemeldete Konto. `teacherId` ist gesetzt, wenn das Konto zu einer Lehrkraft gehört.
        `tourCompletedAt` (seit 1.2.0, #139): wann das Konto den Rundgang durch die Webanwendung beendet
        oder übersprungen hat; `null` = noch nie — das Web zeigt den Rundgang dann beim nächsten Start.
      x-role: ANY
      responses:
        '200':
          description: eigenes Konto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
              example:
                id: 1
                username: admin
                role: PLANNING
                displayName: admin
                teacherId: null
                tourCompletedAt: null
        '401':
          $ref: '#/components/responses/Unauthenticated401'

  /api/me/password:
    put:
      tags: [Anmeldung]
      operationId: changeMyPassword
      summary: Eigenes Passwort ändern
      x-role: ANY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            example:
              oldPassword: admin
              newPassword: neues-passwort
      responses:
        '204':
          description: Passwort geändert
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'

  /api/me/tour:
    put:
      tags: [Anmeldung]
      operationId: markMyTour
      summary: Rundgang durch die Webanwendung beendet oder erneut zeigen (#139, seit 1.2.0)
      description: |
        `completed: true` merkt den Rundgang als beendet (`MeDto.tourCompletedAt` = jetzt) — „Überspringen"
        und „Fertig" im Rundgang. `completed: false` löscht den Zeitpunkt wieder („Rundgang erneut zeigen"
        in den Einstellungen). Am Konto, nicht im Browser: ein zweiter Rechner zeigt den Rundgang nicht
        noch einmal. Wie `PUT /api/me/password` für `PLANNING` und `TEACHER`; ein Klassenkonto bekommt 403.
      x-role: ANY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourFlag'
            example:
              completed: true
      responses:
        '204':
          description: gemerkt
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'

  /api/users:
    get:
      tags: [Konten]
      operationId: listUsers
      summary: Konten auflisten
      x-role: PLANNING
      responses:
        '200':
          description: alle Konten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
              example:
                - { id: 1, username: admin, role: PLANNING, teacherId: null, classId: null, classShort: null }
                - { id: 2, username: meyer, role: TEACHER, teacherId: 1, classId: null, classShort: null }
                - { id: 3, username: schulz, role: TEACHER, teacherId: 2, classId: null, classShort: null }
                - { id: 4, username: weber, role: TEACHER, teacherId: 3, classId: null, classShort: null }
                - { id: 5, username: '7a', role: STUDENT, teacherId: null, classId: 1, classShort: 7a }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
    post:
      tags: [Konten]
      operationId: createUser
      summary: Konto anlegen
      description: |
        Ein Konto der Rolle `TEACHER` braucht `teacherId`, eines der Rolle `STUDENT` braucht
        `classId` (Klassenkonto, E-50); die Planung lässt beide Felder leer. Je Lehrkraft und je
        Klasse gibt es höchstens ein Konto — ein zweites ist 409 `in-use`.
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
            example:
              username: meyer
              password: start-passwort
              role: TEACHER
              teacherId: 1
      responses:
        '201':
          description: Konto angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
              example:
                id: 2
                username: meyer
                role: TEACHER
                teacherId: 1
                classId: null
                classShort: null
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/users/class-accounts:
    post:
      tags: [Konten]
      operationId: createClassAccounts
      summary: Konten für alle Klassen anlegen (E-50)
      description: |
        Legt für **jede aktive Klasse ohne Konto** genau ein Klassenkonto an (Rolle `STUDENT`).
        Benutzername = Klassenkürzel in Kleinbuchstaben („7a"), Passwort zufällig, zehn Zeichen.

        **Die Passwörter stehen genau einmal in dieser Antwort im Klartext** — danach kennt der
        Server nur den BCrypt-Hash. Die Oberfläche zeigt sie zum Abschreiben oder Ausdrucken an;
        wer eines verliert, setzt über `PUT /api/users/{id}/password` ein neues.

        Der Aufruf ist **idempotent**: bestehende Konten bleiben unberührt, ein zweiter Aufruf
        liefert eine leere Liste. Eine Klasse, deren Kürzel schon als anderer Benutzername vergeben
        ist, wird übersprungen (sie lässt sich mit `POST /api/users` unter eigenem Namen anlegen).
        Kein Body nötig; `{}` genügt.
      x-role: PLANNING
      responses:
        '201':
          description: die neu angelegten Konten (leer, wenn jede Klasse schon eines hatte)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassAccountDto'
              example:
                - { username: '7a', classShort: 7a, password: kfr7t2mqbd }
                - { username: 8b, classShort: 8b, password: xq4mvn8pth }
                - { username: 9c, classShort: 9c, password: dw6zks3jrb }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/users/teacher-accounts:
    post:
      tags: [Konten]
      operationId: createTeacherAccounts
      summary: Konten für alle Lehrkräfte anlegen
      description: |
        Legt für **jede aktive Lehrkraft ohne Konto** genau ein Lehrkraftkonto an (Rolle `TEACHER`).
        Benutzername = Lehrkraftkürzel in Kleinbuchstaben („alb"), Passwort zufällig, zehn Zeichen.

        **Die Passwörter stehen genau einmal in dieser Antwort im Klartext** — danach kennt der
        Server nur den BCrypt-Hash. Die Oberfläche zeigt sie zum Abschreiben oder Ausdrucken an;
        wer eines verliert, setzt über `PUT /api/users/{id}/password` ein neues.

        Der Aufruf ist **idempotent**: bestehende Konten bleiben unberührt, ein zweiter Aufruf
        liefert eine leere Liste. Eine Lehrkraft, dessen Kürzel schon als anderer Benutzername vergeben
        ist, wird übersprungen (sie lässt sich mit `POST /api/users` unter eigenem Namen anlegen).
        Kein Body nötig; `{}` genügt.
      x-role: PLANNING
      responses:
        '201':
          description: die neu angelegten Konten (leer, wenn jede Lehrkraft schon eines hatte)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherAccountDto'
              example:
                - { username: alb, teacherName: Albrecht, teacherShort: alb, password: a13g8jadh1 }
                - { username: mei, teacherName: Meier, teacherShort: mei, password: 18iadb1ad2 }
                - { username: scz, teacherName: Schwanitz, teacherShort: scz, password: n2ab2c74ac }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/PathId'
    put:
      tags: [Konten]
      operationId: setUserPassword
      summary: Passwort eines Kontos setzen
      description: Die Planung setzt ein neues Passwort, ohne das alte zu kennen (Passwort-Rücksetzung ohne E-Mail).
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSet'
            example:
              password: neues-passwort
      responses:
        '204':
          description: Passwort gesetzt
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    delete:
      tags: [Konten]
      operationId: deleteUserAccount
      summary: Löschen eines Kontos
      description: Die Planung kann ein Konto entfernen. Das "admin" Konto kann nicht entfernt werden.
      x-role: PLANNING
      responses:
        '204':
          description: Konto gelöscht.
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/ProtectedAccount409'

  /api/teachers:
    get:
      tags: [Lehrkräfte]
      operationId: listTeachers
      summary: Lehrkräfte auflisten
      description: |
        `plannedHours` ist die Summe der Wochenstunden aus allen Klassenzuordnungen (berechnet);
        `warnings[]` meldet Fächer ohne Lehrbefähigung (`SUBJECT_NOT_TAUGHT`) und überschrittenes
        Deputat (`QUOTA_EXCEEDED`) — beides sind Daten, kein Fehler.
      x-role: PLANNING
      responses:
        '200':
          description: alle Lehrkräfte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherDto'
              example:
                - id: 1
                  name: Meyer
                  shortName: MEY
                  weeklyHoursQuota: 25
                  subjectIds: [1, 3]
                  preferredTimeslotIds: []
                  blockedTimeslotIds: []
                  active: true
                  plannedHours: 5
                  warnings: []
                - id: 2
                  name: Schulz
                  shortName: SCZ
                  weeklyHoursQuota: 2
                  subjectIds: [1]
                  preferredTimeslotIds: []
                  blockedTimeslotIds: [34, 35]
                  active: true
                  plannedHours: 1
                  warnings: []
                - id: 3
                  name: Weber
                  shortName: WEB
                  weeklyHoursQuota: 25
                  subjectIds: [2]
                  preferredTimeslotIds: []
                  blockedTimeslotIds: []
                  active: true
                  plannedHours: 2
                  warnings: []
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
    post:
      tags: [Lehrkräfte]
      operationId: createTeacher
      summary: Lehrkraft anlegen
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherInput'
            example:
              name: Schulz
              shortName: SCZ
              weeklyHoursQuota: 2
              subjectIds: [1]
              preferredTimeslotIds: []
              blockedTimeslotIds: [34, 35]
              active: true
      responses:
        '201':
          description: Lehrkraft angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDto'
              example:
                id: 2
                name: Schulz
                shortName: SCZ
                weeklyHoursQuota: 2
                subjectIds: [1]
                preferredTimeslotIds: []
                blockedTimeslotIds: [34, 35]
                active: true
                plannedHours: 0
                warnings: []
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/teachers/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Lehrkräfte]
      operationId: getTeacher
      summary: Lehrkraft lesen
      x-role: PLANNING
      responses:
        '200':
          description: eine Lehrkraft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDto'
              example:
                id: 1
                name: Meyer
                shortName: MEY
                weeklyHoursQuota: 25
                subjectIds: [1, 3]
                preferredTimeslotIds: []
                blockedTimeslotIds: []
                active: true
                plannedHours: 5
                warnings: []
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
    put:
      tags: [Lehrkräfte]
      operationId: updateTeacher
      summary: Lehrkraft ändern
      description: '`active: false` deaktiviert die Lehrkraft — sie bleibt in bestehenden Plänen, wird aber nicht mehr neu eingeplant.'
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherInput'
            example:
              name: Meyer
              shortName: MEY
              weeklyHoursQuota: 25
              subjectIds: [1, 3]
              preferredTimeslotIds: []
              blockedTimeslotIds: []
              active: true
      responses:
        '200':
          description: Lehrkraft geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDto'
              example:
                id: 1
                name: Meyer
                shortName: MEY
                weeklyHoursQuota: 25
                subjectIds: [1, 3]
                preferredTimeslotIds: []
                blockedTimeslotIds: []
                active: true
                plannedHours: 5
                warnings: []
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
