  /api/draft/accept:
    post:
      tags: [Entwurf]
      operationId: acceptDraft
      summary: Jüngsten Entwurf annehmen — er wird der aktive Plan (W-8)
      description: |
        Eine Transaktion: berührte Vorgänger werden verkürzt oder archiviert, Entwurf → `ACTIVE` mit
        `acceptedAt`, Verlaufseintrag `TIMETABLE_ACCEPTED`. Andere Entwürfe bleiben stehen (seit 1.3.0). **Harte
        Konflikte blockieren seit 1.3.0** (409 `draft-has-conflicts` mit `conflicts[]`); weiche nicht (die
        Planung entscheidet). Während einer Berechnung 409 `solving`. Ausnahmen (Vertretungen)
        mit Datum ab heute hängen am alten Plan und verfallen; die Antwort nennt das in `warnings[]`, die
        Web-App fragt **vor** dem Senden nach (`GET /api/exceptions?from=heute`).

        Offene Stunden (ohne `timeslotId`/`roomId`) wandern unverändert in den aktiven Plan und tauchen
        danach in keiner Wochensicht auf. `warnings[]` nennt deshalb zuerst ihre Anzahl
        („*n* Stunden bleiben unverplant …"); der Annehmen-Dialog zeigt dieselbe Zahl schon vorher aus
        `openLessons` des Entwurfs.

        **Kann (E-40, nach Rückfrage R1):** `validFrom` — der neue Plan gilt erst ab diesem Datum; bis
        dahin lösen die Wochensichten den bisherigen Plan auf. Ohne Body oder mit `{}`: gilt sofort.

        **Gültigkeitszeitraum (seit 1.4.0, #115).** `validFrom` ist der Beginn (fehlt: heute),
        `validUntil` das Ende einschließlich (fehlt: unbegrenzt); `validUntil` vor dem Beginn ist 400
        `validation` mit Feld `validUntil`, `validFrom` **vor heute** ist 400 `validation` mit Feld
        `validFrom`. Die Antwort trägt `validFrom` immer als Datum — bei „ab sofort" den heutigen Tag.
        Berührt wird nur, was sich mit dem gewünschten Zeitraum überschneidet:

        - Ein Plan, der **früher begonnen** hat, endet am Tag vor `validFrom` und bleibt aktiv — „der
          alte Plan gilt bis zu seinem Ende weiter". Liegt er damit ganz in der Vergangenheit, wird er
          archiviert.
        - Ein Plan, der **heute schon begonnen** hat und nicht früher als der neue beginnt (eben erst
          angenommen, sofort ersetzt), wird archiviert.
        - Ein Plan, der **erst künftig beginnt** und im Weg liegt: 409 `plan-overlap` — auch bei
          „jetzt aktivieren". Nichts wird geändert; die Planung wählt ein Enddatum vor dessen Beginn
          oder ändert den Zeitraum.

        Ein aktiver Plan, dessen Ende vor heute liegt, wird bei dieser Gelegenheit archiviert — es gibt
        keinen Zeitgeber, der das sonst täte. Zwei Annahmen gleichzeitig gehen nicht aneinander vorbei:
        die zweite wartet und antwortet danach 404 (derselbe Entwurf) oder 409 `plan-overlap`.
      x-role: PLANNING
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDraftInput'
            example: {}
      responses:
        '200':
          description: der neue aktive Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptDraftResponse'
              example:
                id: 2
                acceptedAt: '2026-09-15T10:30:00Z'
                validFrom: '2026-09-21'
                validUntil: null
                lessons:
                  - { id: 11, classId: 1, classShort: 7a, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 1, roomShort: R101, timeslotId: 1, day: MO, position: 1, pinned: true }
                  - { id: 12, classId: 1, classShort: 7a, subjectId: 2, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 1, roomShort: R101, timeslotId: 2, day: MO, position: 2, pinned: true }
                  - { id: 13, classId: 1, classShort: 7a, subjectId: 3, subjectShort: Ph, subjectColor: '#F57C00', teacherId: 1, teacherShort: MEY, roomId: 3, roomShort: P1, timeslotId: 4, day: MO, position: 4, pinned: true }
                  - { id: 14, classId: 2, classShort: 8b, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 2, roomShort: R204, timeslotId: 2, day: MO, position: 2, pinned: true }
                  - { id: 15, classId: 2, classShort: 8b, subjectId: 2, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 2, roomShort: R204, timeslotId: 4, day: MO, position: 4, pinned: true }
                  - { id: 16, classId: 2, classShort: 8b, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 2, roomShort: R204, timeslotId: 5, day: MO, position: 5, pinned: true }
                  - { id: 17, classId: 1, classShort: 7a, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 1, roomShort: R101, timeslotId: 8, day: TU, position: 1, pinned: true }
                  - { id: 18, classId: 3, classShort: 9c, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 2, teacherShort: SCZ, roomId: 1, roomShort: R101, timeslotId: 6, day: MO, position: 6, pinned: true }
                conflicts: []
                warnings:
                  - '2 Vertretungen ab dem 2026-09-21 verfallen: ihre Stunden gibt es im neuen Plan nicht mehr.'
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/AcceptRejected409'

  /api/draft/repair:
    post:
      tags: [Entwurf]
      operationId: repairDraft
      summary: Konflikt per Knopf lösen — Vorschläge rechnen, nichts speichern (#110, seit 1.2.0)
      description: |
        Rechnet **synchron** bis zu drei Vorschläge, wie sich der Konflikt der Stunde `lessonId`
        auflösen lässt (E-53). Drei Stufen mit wachsendem Freiheitsgrad, je Stufe ein Solver-Lauf von
        5 s — die Antwort kann also bis zu 15 s dauern: (1) nur die Konfliktstunde darf wandern, jede
        andere belegte Stunde gilt für den Lauf als festgelegt; (2) dazu die Stunden derselben Klasse am
        selben Tag; (3) dazu alle Stunden der beteiligten Lehrkraft und des beteiligten Raums an diesem
        Tag. Offene Stunden werden nicht eingeplant.

        **Gespeichert wird nichts.** Jeder Vorschlag ist eine Vorschau mit den Zügen (`moves`), der Zahl
        der harten Konflikte im ganzen Entwurf nach dem Vorschlag (`hardConflictsAfter`) und dem Score.
        Übernehmen heißt: je Zug `PATCH /api/draft/lessons/{lessonId}` mit `timeslotId`, `roomId` und
        `pinned: false`. Nur Stufen, die mindestens eine Stunde bewegen, kommen zurück; liefern zwei
        Stufen dieselben Züge, steht der Vorschlag einmal. `proposals` kann leer sein.

        Während der Serie gilt der Entwurf als in Berechnung (`GET /api/draft` → `SOLVING`); jede
        Änderung und jeder weitere Lauf bekommt solange 409 `solving`.

        Fehler: 404 `not-found`, wenn die Stunde nicht im Entwurf steht (oder kein Entwurf da ist);
        400 `validation` (Feld `lessonId`), wenn die Stunde in keinem Konflikt steht oder fehlt;
        409 `solving`, wenn gerade ein Lauf unterwegs ist.
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairInput'
            example:
              lessonId: 18
      responses:
        '200':
          description: Vorschläge, nach Stufe aufsteigend; nichts davon ist gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairResponse'
              example:
                proposals:
                  - level: 1
                    label: Nur diese Stunde verschieben
                    moves:
                      - { lessonId: 18, timeslotId: 6, roomId: 1 }
                    hardConflictsAfter: 0
                    score: 0hard/0medium/0soft
                  - level: 3
                    label: Auch Stunden der Lehrkraft und des Raums am selben Tag umstellen
                    moves:
                      - { lessonId: 18, timeslotId: 5, roomId: 1 }
                      - { lessonId: 11, timeslotId: 6, roomId: 1 }
                    hardConflictsAfter: 0
                    score: 0hard/0medium/-1soft
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/DraftFinished409'

