  /api/masterdata/{scope}/export:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
          enum: [subjects, teachers, rooms, classes, timeslots, rules, holidays]
    get:
      tags: [Sicherung]
      operationId: exportMasterDataSection
      summary: Einen Bereich der Grunddaten exportieren (Format-Version 2)
      description: |
        Liefert **nur den gewählten Bereich**. Enthält bei `teachers` und `classes` zusätzlich die
        Referenzlisten (`refs.subjects`, `refs.teachers`, `refs.timeslots`), über die der Import die
        Verweise auf dem Zielsystem auflöst — die Kennungen der Datei sind dort nicht gültig.

        Anders als der Voll-Export (Version 1) ist die bereichsweise Datei **additiv gedacht**:
        der Import ergänzt und aktualisiert, er löscht nichts. Ausnahme: `timeslots` und `rules`
        ersetzen ihren Bereich vollständig (das Raster ist strukturell, das Regelwerk ist ein Satz).
      x-role: PLANNING
      responses:
        '200':
          description: das Bereichsdokument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataSection'
              example:
                version: '2'
                scope: teachers
                exportedAt: '2026-09-15T10:00:00Z'
                teachers:
                  - { id: 1, name: Meyer, shortName: MEY, weeklyHoursQuota: 25, subjectIds: [1, 3], preferredTimeslotIds: [], blockedTimeslotIds: [], active: true, plannedHours: 5, warnings: [] }
                  - { id: 2, name: Schulz, shortName: SCZ, weeklyHoursQuota: 2, subjectIds: [1], preferredTimeslotIds: [], blockedTimeslotIds: [34, 35], active: true, plannedHours: 1, warnings: [] }
                refs:
                  subjects:
                    - { id: 1, shortName: Ma }
                    - { id: 3, shortName: Ph }
                  timeslots:
                    - { id: 34, day: FR, position: 6 }
                    - { id: 35, day: FR, position: 7 }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/masterdata/{scope}/import:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
          enum: [subjects, teachers, rooms, classes, timeslots, rules, holidays]
    post:
      tags: [Sicherung]
      operationId: importMasterDataSection
      summary: Einen Bereich der Grunddaten einspielen (Format-Version 2)
      description: |
        Ergänzt und aktualisiert den Bereich, angepasst über den **natürlichen Schlüssel**:
        Fächer über `shortName`, Lehrkräfte über `shortName`, Räume und Klassen über `name`,
        Ferien über `name` + Zeitraum. Was schon dasteht, wird aktualisiert — nichts wird gelöscht.

        `timeslots` und `rules` ersetzen ihren Bereich (Raster bzw. Regelwerk sind Sätze).

        Verweise (`subjectIds` in Lehrkräften, `subjects` in Klassen) werden über die
        Referenzlisten `refs` aufgelöst: die Kurzname aus der Datei muss im Zielbestand
        vorhanden sein, sonst 400 `validation` mit dem Pfad in `errors[]`. Reihenfolge beim
        Einspielen mehrerer Bereiche daher: Fächer → Lehrkräfte → Klassen.

        Die Antwort nennt `created` und `updated` — die Summe der Zeilen, die neu angelegt bzw.
        verändert wurden.
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataSection'
      responses:
        '200':
          description: importiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionImportResult'
              example: { scope: teachers, created: 1, updated: 2, warnings: [] }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/masterdata/export:
    get:
      tags: [Sicherung]
      operationId: exportMasterData
      summary: Grunddaten exportieren
      description: |
        Liefert alle Grunddaten als **ein** JSON-Dokument: Fächer, Lehrkräfte, Räume, Klassen
        mit ihren Fächerlisten, Stundenraster, Regelwerk und unterrichtsfreie Zeiträume.

        **Nicht** enthalten sind Systemkonfiguration, Benutzerkonten, Pläne, Entwürfe,
        Ereignisse, Ausnahmen und der Verlauf — jene Daten sind umgebungsspezifisch bzw.
        personenbezogen.

        Kennungen sind im Dokument selbstkonsistent: jede `…Id` in einem Eintrag verweist auf
        die `id` eines Eintrags derselben Datei. Der Import legt alles neu an und schreibt die
        Verweise über eine alte→neue Zuordnung um (Format-Version 1).
      x-role: PLANNING
      responses:
        '200':
          description: vollständiger Grunddatenbestand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataExport'
              example:
                version: '1'
                exportedAt: '2026-09-15T10:00:00Z'
                subjects:
                  - { id: 1, name: Mathematik, shortName: Ma, requiredRoomType: null, color: '#1976D2' }
                  - { id: 2, name: Deutsch, shortName: De, requiredRoomType: null, color: '#388E3C' }
                  - { id: 3, name: Physik, shortName: Ph, requiredRoomType: Fachraum Physik, color: '#F57C00' }
                teachers:
                  - { id: 1, name: Meyer, shortName: MEY, weeklyHoursQuota: 25, subjectIds: [1, 3], preferredTimeslotIds: [], blockedTimeslotIds: [], active: true, plannedHours: 5, warnings: [] }
                  - { id: 2, name: Schulz, shortName: SCZ, weeklyHoursQuota: 2, subjectIds: [1], preferredTimeslotIds: [], blockedTimeslotIds: [34, 35], active: true, plannedHours: 1, warnings: [] }
                  - { id: 3, name: Weber, shortName: WEB, weeklyHoursQuota: 25, subjectIds: [2], preferredTimeslotIds: [], blockedTimeslotIds: [], active: true, plannedHours: 2, warnings: [] }
                rooms:
                  - { id: 1, name: R101, roomType: Klassenraum, active: true }
                  - { id: 2, name: R204, roomType: Klassenraum, active: true }
                  - { id: 3, name: P1, roomType: Fachraum Physik, active: true }
                classes:
                  - id: 1
                    name: 7a
                    grade: 7
                    active: true
                    subjects:
                      - { subjectId: 1, subjectShort: Ma, weeklyHours: 2, teacherId: 1, teacherShort: MEY }
                      - { subjectId: 2, subjectShort: De, weeklyHours: 1, teacherId: 3, teacherShort: WEB }
                      - { subjectId: 3, subjectShort: Ph, weeklyHours: 1, teacherId: 1, teacherShort: MEY }
                    warnings: []
                  - id: 2
                    name: 8b
                    grade: 8
                    active: true
                    subjects:
                      - { subjectId: 1, subjectShort: Ma, weeklyHours: 2, teacherId: 1, teacherShort: MEY }
                      - { subjectId: 2, subjectShort: De, weeklyHours: 1, teacherId: 3, teacherShort: WEB }
                    warnings: []
                  - id: 3
                    name: 9c
                    grade: 9
                    active: true
                    subjects:
                      - { subjectId: 1, subjectShort: Ma, weeklyHours: 1, teacherId: 2, teacherShort: SCZ }
                    warnings: []
                timeslots:
                  - { id: 1, day: MO, position: 1, startTime: '08:00', endTime: '08:45', isBreak: false }
                  - { id: 2, day: MO, position: 2, startTime: '08:50', endTime: '09:35', isBreak: false }
                  - { id: 3, day: MO, position: 3, startTime: '09:35', endTime: '09:55', isBreak: true }
                rules:
                  - { id: 1, type: MAX_LESSONS_PER_DAY, scope: CLASS, grade: null, value: 6, severity: SOFT, weight: 1, active: true, label: Maximale Stunden pro Tag }
                  - { id: 2, type: MAX_LESSONS_PER_WEEK, scope: CLASS, grade: null, value: 30, severity: SOFT, weight: 1, active: true, label: Maximale Stunden pro Woche }
                  - { id: 5, type: NO_LESSONS_IN_BREAKS, scope: null, grade: null, value: 1, severity: HARD, weight: 1, active: true, label: Keine Stunden in Pausen }
                holidays:
                  - { id: 1, name: Herbstferien, dateFrom: '2026-10-19', dateTo: '2026-10-31', kind: VACATION }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/masterdata/import:
    post:
      tags: [Sicherung]
      operationId: importMasterData
      summary: Grunddaten importieren
      description: |
        Spielt ein mit `GET /api/masterdata/export` erzeugtes Dokument ein. Die Datei ersetzt
        den vorhandenen Bestand **vollständig**, wenn `replace: true` gesetzt ist; ohne dieses
        Feld und bei schon vorhandenen Grunddaten antwortet der Server mit 409 `data-exists`
        (wie `POST /api/sample-data`).

        Alles läuft in **einer** Transaktion: schlägt irgendetwas fehl (unbekannte Kennung,
        doppeltes Kürzel, ungültige Uhrzeit), bleibt der alte Bestand unverändert. Der Server
        prüft in drei Stufen: (1) Pflichtfelder und Format (Bean-Validation), (2) Referenzen
        innerhalb der Datei (`classes[2].subjects[1].teacherId` → `teachers[].id` usw.),
        (3) fachliche Regeln — dieselben wie beim Einzelanlegen.

        **Nicht** in der Datei: Systemkonfiguration, Benutzerkonten, Pläne, Ereignisse,
        Ausnahmen und Verlauf. Das Konto `admin` (Rolle `PLANNING`) und seine Sitzung bleiben
        deshalb erhalten; Konten von Lehrkräften und Klassenkonten werden mit den Grunddaten
        gelöscht (sie verweisen darauf).
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataImport'
            example:
              version: '1'
              replace: true
              subjects:
                - { id: 1, name: Mathematik, shortName: Ma, requiredRoomType: null, color: '#1976D2' }
              teachers:
                - { id: 1, name: Meyer, shortName: MEY, weeklyHoursQuota: 25, subjectIds: [1], preferredTimeslotIds: [], blockedTimeslotIds: [], active: true, plannedHours: 0, warnings: [] }
              rooms:
                - { id: 1, name: R101, roomType: Klassenraum, active: true }
              classes:
                - id: 1
                  name: 7a
                  grade: 7
                  active: true
                  subjects:
                    - { subjectId: 1, subjectShort: Ma, weeklyHours: 2, teacherId: 1, teacherShort: MEY }
                  warnings: []
              timeslots:
                - { id: 1, day: MO, position: 1, startTime: '08:00', endTime: '08:45', isBreak: false }
              rules:
                - { id: 1, type: MAX_LESSONS_PER_DAY, scope: CLASS, grade: null, value: 6, severity: SOFT, weight: 1, active: true, label: Maximale Stunden pro Tag }
              holidays: []
      responses:
        '200':
          description: importiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataImportResult'
              example: { subjects: 3, teachers: 3, rooms: 3, classes: 3, timeslots: 35, rules: 5, holidays: 1, warnings: [] }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          description: Es sind bereits Grunddaten vorhanden und `replace` fehlt.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: urn:pushnpull:problem:data-exists
                title: Es sind bereits Daten vorhanden
                status: 409
                detail: Die Datenbank enthält bereits Grunddaten. Zum Ersetzen „replace“ setzen.

components:

  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Zugriffsmerkmal aus `POST /api/auth/login`, gesendet als `Authorization: Bearer <token>`.
        Der Server speichert nur den SHA-256-Hash mit Ablauf nach zwölf Stunden. Kein JWT, keine
        Cookies, kein externer Anmeldedienst.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: ID des Datensatzes
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    PathLessonId:
      name: lessonId
      in: path
      required: true
      description: ID der Stunde im Entwurf (seit 1.3.0, `/api/drafts/{id}/lessons/{lessonId}`)
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 22

  responses:
    Validation400:
      description: Eingabe ungültig (Bean-Validation oder unlesbares JSON)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:validation
            title: Eingabe ungültig
            status: 400
            detail: Bitte die markierten Felder prüfen.
            errors:
              - { field: weeklyHours, message: muss mindestens 1 sein }
    Unauthenticated401:
      description: kein, ungültiges oder abgelaufenes Token — oder falsches Passwort
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:unauthenticated
            title: Nicht angemeldet
            status: 401
            detail: Bitte erneut anmelden.
    Forbidden403:
      description: falsche Rolle oder fremde Ressource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:forbidden
            title: Keine Berechtigung
            status: 403
            detail: Dieser Bereich ist der Planung vorbehalten.
    NotFound404:
      description: unbekannte ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:not-found
            title: Nicht gefunden
            status: 404
            detail: Es gibt keinen Datensatz mit dieser Nummer.
    Conflict409:
      description: Der Datensatz wird noch verwendet oder widerspricht dem vorhandenen Stand.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:in-use
            title: Lehrkraft wird noch verwendet
            status: 409
            detail: Meyer ist in 4 Stunden eingeplant. Deaktivieren statt löschen.
    PresetMissing409:
      description: Zu diesem Bundesland und Schuljahr liegt keine Ferien- und Feiertagsvorlage bei (E-51).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:preset-missing
            title: Konflikt
            status: 409
            detail: 'Fuer SH und das Schuljahr 2030/31 gibt es keine Vorlage. Vorhanden: 2026/27, 2027/28.'
    ProtectedAccount409:
      description: Das Konto "admin" kann nicht entfernt werden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:protected-account
            title: Konflikt
            status: 409
            detail: Das Konto "admin" kann nicht entfernt werden.
    Solving409:
      description: Der Entwurf wird gerade berechnet; erst abwarten oder abbrechen (DELETE /api/draft/solve).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:solving
            title: Berechnung läuft
            status: 409
            detail: Der Entwurf wird gerade berechnet. Bitte warten oder die Berechnung abbrechen.
    DraftFinished409:
      description: |
        Der Entwurf liegt in der Ablage (`draft-finished`, seit 1.4.0, #116) und wird nicht mehr
        bearbeitet; erst `PATCH /api/drafts/{id} {finished: false}`. Derselbe Endpunkt antwortet
        `solving`, wenn gerade gerechnet wird.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:draft-finished
            title: Konflikt
            status: 409
            detail: Der Entwurf liegt in der Ablage. Erst wieder öffnen.
    AcceptRejected409:
      description: |
        Annehmen abgelehnt — der Entwurf hat harte Konflikte (`draft-has-conflicts`, seit 1.3.0, mit
        `conflicts[]`), ein bereits angenommener Plan mit künftigem Beginn liegt im gewünschten
        Zeitraum (`plan-overlap`, seit 1.4.0), oder der Entwurf wird gerade berechnet (`solving`). In
        allen drei Fällen wird nichts geändert.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: urn:pushnpull:problem:plan-overlap
            title: Konflikt
            status: 409
            detail: Ein angenommener Plan gilt bereits ab 2027-02-01. Enddatum vor 2027-02-01 wählen oder den Zeitraum ändern.
  schemas:

    MasterDataSection:
      type: object
      description: |
        Ein Bereich der Grunddaten (Format-Version 2). Nur das Feld zum `scope` ist gefüllt.
        `refs` trägt die Referenzlisten, über die der Import Verweise auflöst — bei `teachers`
        und `classes` gesetzt, sonst `null`.
      required: [version, scope, exportedAt]
      properties:
        version:
          type: string
          enum: ['2']
        scope:
          type: string
          enum: [subjects, teachers, rooms, classes, timeslots, rules, holidays]
        exportedAt: { type: string, format: date-time }
        subjects: { type: [array, 'null'], items: { $ref: '#/components/schemas/SubjectDto' } }
        teachers: { type: [array, 'null'], items: { $ref: '#/components/schemas/TeacherDto' } }
        rooms:    { type: [array, 'null'], items: { $ref: '#/components/schemas/RoomDto' } }
        classes:  { type: [array, 'null'], items: { $ref: '#/components/schemas/ClassDto' } }
        timeslots: { type: [array, 'null'], items: { $ref: '#/components/schemas/TimeslotDto' } }
        rules:    { type: [array, 'null'], items: { $ref: '#/components/schemas/RuleDto' } }
        holidays: { type: [array, 'null'], items: { $ref: '#/components/schemas/HolidayDto' } }
        refs:
          oneOf:
            - $ref: '#/components/schemas/SectionRefs'
            - type: 'null'

    SectionRefs:
      type: object
      properties:
        subjects:
          type: [array, 'null']
          items:
            type: object
            required: [id, shortName]
            properties:
              id: { type: integer, format: int64 }
              shortName: { type: string }
        teachers:
          type: [array, 'null']
          items:
            type: object
            required: [id, shortName]
            properties:
              id: { type: integer, format: int64 }
              shortName: { type: string }
        timeslots:
          type: [array, 'null']
          items:
            type: object
            required: [id, day, position]
            properties:
              id: { type: integer, format: int64 }
              day: { $ref: '#/components/schemas/Weekday' }
              position: { type: integer, minimum: 1 }

    SectionImportResult:
      type: object
      required: [scope, created, updated, warnings]
      properties:
        scope: { type: string }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        warnings: { type: array, items: { type: string } }

    Role:
      type: string
      enum: [PLANNING, TEACHER, STUDENT]
      description: |
        Rolle eines Kontos. In der Oberfläche heißt PLANNING „Planung", TEACHER „Lehrkraft" und
        STUDENT „Klasse". STUDENT ist ein Klassenkonto: ein Konto je Klasse, das nur den Plan der
        eigenen Klasse liest (E-50, NACHTRAG 05.09.).

    Weekday:
      type: string
      enum: [MO, TU, WE, TH, FR, SA]
      description: Wochentag; SA ist vorgesehen, im Referenzszenario aber unbenutzt.

    Severity:
      type: string
      enum: [HARD, SOFT]
      description: hart (darf nie verletzt werden) oder weich (Verletzung kostet Punkte)

    RuleType:
      type: string
      enum: [MAX_LESSONS_PER_DAY, MAX_LESSONS_PER_WEEK, NO_LESSONS_IN_BREAKS]

    RuleScope:
      type: string
      enum: [CLASS, TEACHER]

    WarningCode:
      type: string
      enum: [SUBJECT_NOT_TAUGHT, QUOTA_EXCEEDED]
      description: SUBJECT_NOT_TAUGHT = Lehrkraft hat das Fach nicht; QUOTA_EXCEEDED = Deputat überschritten

    ConflictType:
      type: string
      enum: [ROOM_DOUBLE_BOOKED, TEACHER_DOUBLE_BOOKED, CLASS_DOUBLE_BOOKED, TEACHER_BLOCKED_TIME, ROOM_TYPE_MISMATCH, RULE_VIOLATION, ROOM_BLOCKED_TIME]
      description: ROOM_BLOCKED_TIME seit v1.1.0 (#133) — Stunde in einer wöchentlichen Sperrzeit des Raums (`RoomDto.blockedTimeslotIds`), immer hart

    ObjectKind:
      type: string
      enum: [CLASS, TEACHER, ROOM]

    HealthDto:
      type: object
      description: Antwort von GET /api/health
      required: [status, schoolName]
      properties:
        status:
          type: string
          description: '"UP", solange der Server antwortet'
          examples: [UP]
        schoolName:
          type: string
          description: Schulname aus der Systemkonfiguration; die App zeigt ihn nach dem Verbindungstest
          examples: [Gymnasium Musterstadt]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          examples: [admin]
        password:
          type: string
          minLength: 1
          format: password
          examples: [admin]

    LoginResponse:
      type: object
      required: [token, role, displayName, teacherId]
      properties:
        token:
          type: string
          description: 'Zugriffsmerkmal für den Header `Authorization: Bearer <token>`; zwölf Stunden gültig'
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
          description: Anzeigename für die Kopfzeile (Name der Lehrkraft, sonst Benutzername)
        teacherId:
          type: [integer, 'null']
          format: int64
          description: gesetzt, wenn das Konto zu einer Lehrkraft gehört

    MeDto:
      type: object
      required: [id, username, role, displayName, teacherId]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        displayName: { type: string }
        teacherId:
          type: [integer, 'null']
          format: int64
        tourCompletedAt:
          type: [string, 'null']
          format: date-time
          description: seit 1.2.0 (#139) — wann der Rundgang beendet oder übersprungen wurde; `null` = noch nie

    TourFlag:
      type: object
      description: Body von PUT /api/me/tour (#139) — true = Rundgang beendet, false = erneut zeigen.
      required: [completed]
      properties:
        completed: { type: boolean }

    PasswordChange:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password, minLength: 1 }
        newPassword: { type: string, format: password, minLength: 8 }

    PasswordSet:
      type: object
      description: Body von PUT /api/users/{id}/password — die Planung setzt ein neues Passwort ohne Kenntnis des alten.
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 8 }

    UserDto:
      type: object
      required: [id, username, role, teacherId, classId, classShort]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role:
          $ref: '#/components/schemas/Role'
        teacherId:
          type: [integer, 'null']
          format: int64
        classId:
          type: [integer, 'null']
          format: int64
          description: gesetzt bei der Rolle STUDENT — die Klasse dieses Klassenkontos (E-50)
        classShort:
          type: [string, 'null']
          description: Name der Klasse („7a"); nur zum Anzeigen, damit die Kontenliste nichts nachladen muss

    CreateUser:
      type: object
      description: Body von POST /api/users
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 8 }
        role:
          $ref: '#/components/schemas/Role'
        teacherId:
          type: [integer, 'null']
          format: int64
          description: Pflicht bei der Rolle TEACHER, sonst leer
        classId:
          type: [integer, 'null']
          format: int64
          description: Pflicht bei der Rolle STUDENT (Klassenkonto, E-50), sonst leer

    ClassAccountDto:
      type: object
      description: |
        Eine Zeile der Antwort von POST /api/users/class-accounts. `password` steht hier **einmal**
        im Klartext — der Server speichert nur den BCrypt-Hash und gibt es nie wieder heraus. Wer es
        verliert, setzt über PUT /api/users/{id}/password ein neues.
      required: [username, classShort, password]
      properties:
        username: { type: string, examples: ['7a'] }
        classShort: { type: string, examples: ['7a'] }
        password: { type: string, format: password, examples: [kfr7t2mqbd] }

    TeacherAccountDto:
      type: object
      description: |
        Eine Zeile der Antwort von POST /api/users/teacher-accounts. `password` steht hier **einmal**
        im Klartext — der Server speichert nur den BCrypt-Hash und gibt es nie wieder heraus. Wer es
        verliert, setzt über PUT /api/users/{id}/password ein neues.
      required: [username, teacherName, teacherShort, password]
      properties:
        username: { type: string, examples: ['alb'] }
        teacherName: { type: string, examples: ['Albrecht'] }
        teacherShort: { type: string, examples: ['alb'] }
        password: { type: string, format: password, examples: [a13g8jadh1] }

    WarningDto:
      type: object
      description: Hinweis in einer 200-Antwort — nie ein Fehler
      required: [code, message, teacherId]
      properties:
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
          type: string
          description: deutscher Text für die Oberfläche
        teacherId:
          type: [integer, 'null']
          format: int64

    TeacherDto:
      type: object
      required: [id, name, shortName, weeklyHoursQuota, subjectIds, preferredTimeslotIds, blockedTimeslotIds, active, plannedHours, warnings]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: [Meyer] }
        shortName: { type: string, description: Kürzel für die Planungsraster, examples: [MEY] }
        weeklyHoursQuota: { type: integer, minimum: 0, description: Deputat in Wochenstunden, examples: [25] }
        subjectIds:
          type: array
          items: { type: integer, format: int64 }
          description: Fächer, die die Lehrkraft unterrichten darf
        preferredTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
          description: Wunschzeiten (weich)
        blockedTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
          description: Sperrzeiten (hart)
        active: { type: boolean, description: 'false = deaktiviert: bleibt in alten Plänen, wird nicht neu eingeplant' }
        plannedHours: { type: integer, minimum: 0, description: Summe der Wochenstunden aus allen Klassenzuordnungen (berechnet) }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningDto'

    TeacherInput:
      type: object
      required: [name, shortName, weeklyHoursQuota, subjectIds, preferredTimeslotIds, blockedTimeslotIds, active]
      properties:
        name: { type: string, minLength: 1 }
        shortName: { type: string, minLength: 1, maxLength: 10 }
        weeklyHoursQuota: { type: integer, minimum: 0 }
        subjectIds:
          type: array
          items: { type: integer, format: int64 }
        preferredTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
        blockedTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
        active: { type: boolean }

    SubjectDto:
      type: object
      required: [id, name, shortName, requiredRoomType, color]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: [Mathematik] }
        shortName: { type: string, examples: [Ma] }
        requiredRoomType:
          type: [string, 'null']
          description: geforderte Raumart; null = jeder Raum passt
          examples: [Fachraum Physik]
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Farbe der Fachkacheln im Plan
          examples: ['#1976D2']

    SubjectInput:
      type: object
      required: [name, shortName, requiredRoomType, color]
      properties:
        name: { type: string, minLength: 1 }
        shortName: { type: string, minLength: 1, maxLength: 10 }
        requiredRoomType:
          type: [string, 'null']
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    RoomDto:
      type: object
      required: [id, name, roomType, active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: [R101] }
        roomType: { type: string, description: Raumart; muss zur geforderten Raumart des Fachs passen, examples: [Klassenraum] }
        active: { type: boolean }
        blockedTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
          description: 'Wöchentliche Sperrzeiten des Raums (hart, wie bei der Lehrkraft); seit v1.1.0 (#133). Der Server liefert das Feld immer, Standard leer'

    RoomInput:
      type: object
      required: [name, roomType, active]
      properties:
        name: { type: string, minLength: 1 }
        roomType: { type: string, minLength: 1 }
        active: { type: boolean }
        blockedTimeslotIds:
          type: array
          items: { type: integer, format: int64 }
          description: 'Wöchentliche Sperrzeiten (hart); optional seit v1.1.0 (#133), fehlend = keine Sperre. Jede Kennung muss ein Zeitfenster sein, sonst 400 `validation`'

    ClassSubjectDto:
      type: object
      description: eine Zeile der Fächerliste einer Klasse
      required: [subjectId, subjectShort, weeklyHours, teacherId, teacherShort]
      properties:
        subjectId: { type: integer, format: int64 }
        subjectShort: { type: string }
        weeklyHours: { type: integer, minimum: 1 }
        teacherId: { type: integer, format: int64 }
        teacherShort: { type: string }

    ClassSubjectInput:
      type: object
      description: 'eine Zeile beim Speichern; `weeklyHours` oder `teacherId` leer wird mit 400 abgelehnt'
      required: [subjectId, weeklyHours, teacherId]
      properties:
        subjectId: { type: integer, format: int64 }
        weeklyHours:
          type: [integer, 'null']
          minimum: 1
        teacherId:
          type: [integer, 'null']
          format: int64

    ClassDto:
      type: object
      required: [id, name, grade, active, subjects, warnings]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: [7a] }
        grade: { type: integer, minimum: 1, description: Jahrgang, examples: [7] }
        active: { type: boolean }
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ClassSubjectDto'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningDto'

    ClassInput:
      type: object
      required: [name, grade, active]
      properties:
        name: { type: string, minLength: 1 }
        grade: { type: integer, minimum: 1 }
        active: { type: boolean }

    TimeslotDto:
      type: object
      required: [id, day, position, startTime, endTime, isBreak]
      properties:
        id: { type: integer, format: int64 }
        day:
          $ref: '#/components/schemas/Weekday'
        position: { type: integer, minimum: 1, description: 'laufende Nummer des Zeitfensters am Tag, Pausen mitgezählt' }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['08:00'] }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['08:45'] }
        isBreak: { type: boolean, description: 'true = Pause: kein Unterricht, aber Teil des Rasters' }

    TimeslotInput:
      type: object
      required: [day, position, startTime, endTime, isBreak]
      properties:
        id:
          type: integer
          format: int64
          description: gesetzt = ändern, fehlend = neu anlegen
        day:
          $ref: '#/components/schemas/Weekday'
        position: { type: integer, minimum: 1 }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        isBreak: { type: boolean }

    TimegridDto:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeslotDto'

    TimegridInput:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeslotInput'

    RuleDto:
      type: object
      required: [id, type, scope, grade, value, severity, weight, active, label]
      properties:
        id: { type: integer, format: int64 }
        type:
          $ref: '#/components/schemas/RuleType'
        scope:
          oneOf:
            - $ref: '#/components/schemas/RuleScope'
            - type: 'null'
          description: null = betrifft weder Klasse noch Lehrkraft (Pausenregel)
        grade:
          type: [integer, 'null']
          minimum: 1
          description: null = schulweit; gesetzt = nur dieser Jahrgang (Soll, E-47)
        value: { type: integer, minimum: 1, description: Zahlenwert der Regel; kleiner als 1 wird mit 400 abgelehnt }
        severity:
          $ref: '#/components/schemas/Severity'
        weight: { type: integer, minimum: 1, description: Gewicht der weichen Regel }
        active: { type: boolean }
        label: { type: string, description: deutscher Text für die Oberfläche }

    RuleInput:
      type: object
      description: 'PUT ändert Wert, Härte, Gewicht und Aktivierung; POST braucht zusätzlich type, scope und grade.'
      required: [value, severity, weight, active]
      properties:
        type:
          $ref: '#/components/schemas/RuleType'
        scope:
          oneOf:
            - $ref: '#/components/schemas/RuleScope'
            - type: 'null'
        grade:
          type: [integer, 'null']
          minimum: 1
        value: { type: integer, minimum: 1 }
        severity:
          $ref: '#/components/schemas/Severity'
        weight: { type: integer, minimum: 1 }
        active: { type: boolean }

    ConfigDto:
      type: object
      required: [schoolName, state, schoolType, maxSolveSeconds]
      properties:
        schoolName: { type: string, minLength: 1, examples: [Gymnasium Musterstadt] }
        state:
          type: string
          description: Bundesland-Kürzel; wählt die Voreinstellung für POST /api/rules/reset (E-48)
          enum: [BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH]
          examples: [SH]
        schoolType: { type: string, description: 'Schulform als Datum, keine Fallunterscheidung im Code', examples: [GYMNASIUM] }
        maxSolveSeconds: { type: integer, minimum: 1, maximum: 600, description: 'Rechenzeit je Berechnung in Sekunden; die Obergrenze schützt den einen Solver-Thread (601 → 400 „höchstens 600")', examples: [60] }

    SampleDataRequest:
      type: object
      properties:
        replace:
          type: boolean
          default: false
          description: true = vorhandene Daten ersetzen statt 409 zu melden (E-46)

    SampleDataResult:
      type: object
      description: Anzahl der geladenen Datensätze
      required: [classes, teachers, rooms]
      properties:
        classes: { type: integer, minimum: 0, examples: [12] }
        teachers: { type: integer, minimum: 0, examples: [24] }
        rooms: { type: integer, minimum: 0, examples: [18] }

    ConflictObject:
      type: object
      description: das Objekt, an dem ein Konflikt hängt — für die Oberfläche zum Anspringen
      required: [kind, id, label]
      properties:
        kind:
          $ref: '#/components/schemas/ObjectKind'
        id: { type: integer, format: int64 }
        label: { type: string }

    ConflictDto:
      type: object
      description: |
        Ein Konflikt ist immer ein Datum, nie ein Fehler: Entwurf, aktiver Plan und die Antwort auf
        eine neue Ausnahme tragen `conflicts[]`; im Fehlerkörper steht er nur bei `pinned-contradiction`.
        Der Text `message` nennt Regel, Wert, Objekt und Tag in Schulsprache (T-W2.1); `objects[]` sind
        die beteiligten Objekte zum Anspringen (T-W3.1: der Raum R101 und beide Stunden in `lessonIds`).
      required: [type, severity, message, lessonIds, ruleId, objects]
      properties:
        type:
          $ref: '#/components/schemas/ConflictType'
        severity:
          $ref: '#/components/schemas/Severity'
        message: { type: string, description: deutscher Text für die Oberfläche }
        lessonIds:
          type: array
          items: { type: integer, format: int64 }
        ruleId:
          type: [integer, 'null']
          format: int64
          description: gesetzt bei RULE_VIOLATION
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ConflictObject'

    FieldErrorDto:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [weeklyHours] }
        message: { type: string, examples: [muss mindestens 1 sein] }

    ProblemDetail:
      type: object
      description: |
        Fehlerkörper nach RFC 9457, ausgeliefert als `application/problem+json`.
        `type` ist immer `urn:pushnpull:problem:<slug>` mit den Slugs `validation`, `unauthenticated`,
        `forbidden`, `not-found`, `in-use`, `solving`, `master-data-incomplete`,
        `pinned-contradiction`, `data-exists`, `exception-exists`, `preset-missing`,
        `draft-has-conflicts` (seit 1.3.0: Annehmen eines Entwurfs mit harten Konflikten, `conflicts[]`
        wie bei `pinned-contradiction`), `plan-overlap` (seit 1.4.0: der gewünschte Zeitraum
        überschneidet sich mit einem Plan, der erst künftig beginnt — auch bei „jetzt aktivieren"; und
        bei zwei gleichzeitigen Annahmen mit überschneidenden Zeiträumen), `protected-account`
        (`DELETE /api/users/{id}` auf das Konto „admin"), `draft-finished` (seit 1.4.0:
        der Entwurf liegt in der Ablage und wird nicht mehr bearbeitet), `internal`. `draft-exists`
        gab es bis 1.3.0 (ein Entwurf) und kommt seit 1.3.0 nicht mehr vor.
      required: [type, title, status]
      properties:
        type: { type: string, examples: ['urn:pushnpull:problem:in-use'] }
        title: { type: string, description: kurze deutsche Überschrift }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string, description: ausführlicher deutscher Text für die Oberfläche }
        instance: { type: string, description: angefragter Pfad }
        errors:
          type: array
          description: nur bei `validation`
          items:
            $ref: '#/components/schemas/FieldErrorDto'
        missing:
          type: array
          description: nur bei `master-data-incomplete`
          items: { type: string }
        conflicts:
          type: array
          description: nur bei `pinned-contradiction` und `draft-has-conflicts`
          items:
            $ref: '#/components/schemas/ConflictDto'

    # ---------------------------------------------------------------------------------------------- v1

    View:
      type: string
      enum: [SCHOOL, CLASS, TEACHER, ROOM]
      description: Plansicht (W-4); ROOM ist die Raumsicht (Musskriterium E-39)

    EntryKind:
      type: string
      enum: [REGULAR, NEEDS_SUBSTITUTION, SUBSTITUTED, GIVEN_AWAY, MOVED, CANCELLED, ADDED]
      description: |
        Art eines Wocheneintrags. REGULAR = Regelplan; NEEDS_SUBSTITUTION = vertretungsbedürftig („noch
        nicht vertreten"); SUBSTITUTED = andere Lehrkraft und/oder anderer Raum; GIVEN_AWAY = nur in der
        Sicht TEACHER: die eigene Stunde, die eine andere Lehrkraft übernimmt; MOVED = Ziel einer Verlegung;
        CANCELLED = entfällt (auch der Ursprung einer Verlegung, mit `reasons` „verlegt → …"); ADDED =
        Zusatzstunde ohne Regelplanstunde (`lessonId: null`).

    DraftStatus:
      type: string
      enum: [EDITING, SOLVING, FAILED]

    DraftSource:
      type: string
      enum: [EMPTY, COPY_ACTIVE]

    EventKind:
      type: string
      enum: [TEACHER_ABSENCE, ROOM_BLOCKED, EXTRA_LESSON]

    ExceptionKind:
      type: string
      enum: [SUBSTITUTION, MOVE, CANCEL, ADDED]

    ChangelogAction:
      type: string
      enum: [EXCEPTION_CREATED, EXCEPTION_DELETED, TIMETABLE_ACCEPTED]

    HolidayKind:
      type: string
      enum: [VACATION, PUBLIC_HOLIDAY]

    LessonDto:
      type: object
      description: Eine Stunde des Wochenmusters (Entwurf oder aktiver Plan). Zeitfenster und Raum sind beide gesetzt („belegt") oder beide null („offen"); einen dritten Zustand gibt es nicht (T-W8.1).
      required: [id, classId, classShort, subjectId, subjectShort, subjectColor, teacherId, teacherShort, roomId, roomShort, timeslotId, day, position, pinned]
      properties:
        id: { type: integer, format: int64 }
        classId: { type: integer, format: int64 }
        classShort: { type: string, examples: [7a] }
        subjectId: { type: integer, format: int64 }
        subjectShort: { type: string, examples: [Ma] }
        subjectColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        teacherId: { type: integer, format: int64, description: aus der Fachzuordnung der Klasse; die Stunde trägt keine eigene Lehrkraft (E-18) }
        teacherShort: { type: string, examples: [MEY] }
        roomId: { type: [integer, 'null'], format: int64 }
        roomShort: { type: [string, 'null'] }
        timeslotId: { type: [integer, 'null'], format: int64, description: null = offene Stunde }
        day:
          oneOf:
            - $ref: '#/components/schemas/Weekday'
            - type: 'null'
        position: { type: [integer, 'null'], minimum: 1 }
        pinned: { type: boolean, description: festgelegt (W-9) — der Solver lässt die Stunde stehen }

    TimetableDto:
      type: object
      description: 'Ein angenommener Regelplan mit seinem Gültigkeitszeitraum. Vor der ersten Annahme `id: null` und leere Listen.'
      required: [id, acceptedAt, validFrom, validUntil, lessons, conflicts]
      properties:
        id: { type: [integer, 'null'], format: int64 }
        acceptedAt: { type: [string, 'null'], format: date-time }
        validFrom:
          type: [string, 'null']
          format: date
          description: |
            Ab welchem Kalendertag dieser Plan gilt (E-40), einschließlich. `null`, wenn ohne Stichtag
            angenommen — dann gilt er ab dem Tag der Annahme. Ergänzt am 05.09. (Befund
            PFLICHTENHEFT-6): vorher musste die Web-App den Beginn aus `acceptedAt` raten und zeigte
            bei einem Plan mit Stichtag das falsche Datum.
        validUntil:
          type: [string, 'null']
          format: date
          description: |
            Letzter Kalendertag, an dem dieser Plan gilt (einschließlich, seit 1.4.0, #115). `null` =
            unbegrenzt. Nach diesem Tag löst keine Wochensicht mehr auf diesen Plan auf — steht kein
            Nachfolger bereit, bleibt die Woche leer.
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonDto'
        conflicts:
          type: array
          description: bei jedem Lesen neu berechnet (E-31)
          items:
            $ref: '#/components/schemas/ConflictDto'

    TimetableSummaryDto:
      type: object
      description: |
        Eine Zeile von `GET /api/timetables` (seit 1.4.0, #115) — ein aktiver Plan mit seinem Zeitraum,
        ohne Stunden.
      required: [id, acceptedAt, validFrom, validUntil, current]
      properties:
        id: { type: integer, format: int64 }
        acceptedAt: { type: [string, 'null'], format: date-time }
        validFrom: { type: [string, 'null'], format: date, description: Beginn einschließlich; `null` = ab dem Tag der Annahme }
        validUntil: { type: [string, 'null'], format: date, description: Ende einschließlich; `null` = unbegrenzt }
        current:
          type: boolean
          description: |
            Gilt dieser Plan **heute**? Trägt höchstens einer. In einer Lücke zwischen zwei Zeiträumen
            trägt ihn keiner — das ist ein Zustand, kein Fehler; `GET /api/timetable` liefert dann den
            Plan mit dem nächsten künftigen Beginn.

    AcceptDraftResponse:
      allOf:
        - $ref: '#/components/schemas/TimetableDto'
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: >-
                deutsche Hinweise, in dieser Reihenfolge: offene Stunden, die unverplant in den aktiven
                Plan wandern; danach die verfallenden Vertretungen. Gezählt werden nur die, deren Stunde
                der neue Plan verschiebt, umräumt oder streicht — Vertretungen an unverändert
                übernommenen Stunden hängt der Server auf die neue Stunde um und sie bleiben wirksam
                (dieselbe Zahl nennt `expiringExceptions` am `DraftDto` schon vor dem Annehmen)
              items: { type: string }

    SolveInfo:
      type: object
      description: Daten des letzten bzw. laufenden Solver-Laufs für die Fortschrittsanzeige (verstrichene Zeit / limitSeconds)
      required: [startedAt, limitSeconds, lastScore, error]
      properties:
        startedAt: { type: [string, 'null'], format: date-time }
        limitSeconds: { type: [integer, 'null'], minimum: 1, description: Rechenzeit dieses Laufs aus der Systemkonfiguration }
        lastScore: { type: [string, 'null'], description: 'Timefold-Score des letzten Laufs, z. B. "0hard/0medium/-2soft"' }
        error: { type: [string, 'null'], description: 'deutscher Fehlertext, wenn der Lauf abgebrochen ist (status FAILED)' }

    OpenLessonDto:
      type: object
      description: fehlende Wochenstunden je Klasse und Fach (offene Stunden, zugleich Pflichtfächer-Prüfung)
      required: [classId, classShort, subjectShort, missing]
      properties:
        classId: { type: integer, format: int64 }
        classShort: { type: string }
        subjectShort: { type: string }
        missing: { type: integer, minimum: 1 }

    DraftDto:
      type: object
      required: [id, name, finished, createdAt, status, solve, lessons, conflicts, openLessons, warnings, expiringExceptions]
      properties:
        id: { type: integer, format: int64 }
        name:
          type: string
          maxLength: 80
          description: 'Name des Entwurfs (seit 1.3.0, #103): unterscheidet mehrere Entwürfe; Standard „Entwurf n"'
        finished:
          type: boolean
          description: |
            Liegt der Entwurf in der Ablage (seit 1.4.0, #116)? Dann ist er eingefroren: Stunden
            anlegen, ändern und löschen, Berechnen und Reparieren antworten 409 `draft-finished`.
            Annehmen, Umbenennen und Löschen bleiben erlaubt; `PATCH {finished: false}` öffnet ihn
            wieder.
        createdAt: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/DraftStatus'
        solve:
          $ref: '#/components/schemas/SolveInfo'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonDto'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictDto'
        openLessons:
          type: array
          items:
            $ref: '#/components/schemas/OpenLessonDto'
        warnings:
          type: array
          description: 'deutsche Hinweise, z. B. überzählige Stunden („7a Ma: 3 Stunden geplant, 2 vorgesehen")'
          items: { type: string }
        expiringExceptions:
          type: integer
          format: int64
          description: >-
            Wie viele datierte Vertretungen ab heute das Annehmen dieses Entwurfs verfallen ließe.
            Gezählt werden nur die, deren Stunde der Entwurf verschiebt, in einen anderen Raum legt oder
            streicht — Vertretungen an unverändert übernommenen Stunden wandern beim Annehmen mit und
            zählen nicht (E-40, Befund PFLICHTENHEFT-9). `0` heißt: beim Annehmen geht nichts verloren;
            der Annehmen-Dialog verlangt dann keine Bestätigung.

    CreateDraft:
      type: object
      required: [source]
      properties:
        name:
          type: string
          maxLength: 80
          description: 'Kann (seit 1.3.0, #103): Name des Entwurfs; fehlt er, „Entwurf n" mit der ersten freien Nummer'
        source:
          $ref: '#/components/schemas/DraftSource'

    DraftPatchInput:
      type: object
      description: |
        Body von PATCH /api/drafts/{id} (seit 1.4.0, #103 und #116) — Name und/oder Ablage. Nur
        gesendete Felder wirken; ein leerer Body ist 400 `validation` (Feld `name`). Ersetzt
        `DraftNameInput` aus 1.3.0 (unveröffentlicht, gleicher Zug).
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        finished: { type: boolean, description: '`true` legt den Entwurf in die Ablage, `false` öffnet ihn wieder' }

    DraftSummaryDto:
      type: object
      description: Eine Zeile von GET /api/drafts (seit 1.3.0, #103) — Kennzahlen ohne Stunden
      required: [id, name, finished, createdAt, source, status, hardConflicts]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        finished: { type: boolean, description: 'liegt der Entwurf in der Ablage (seit 1.4.0, #116)?' }
        createdAt: { type: string, format: date-time }
        source:
          $ref: '#/components/schemas/DraftSource'
        status:
          $ref: '#/components/schemas/DraftStatus'
        hardConflicts:
          type: integer
          description: Zahl der harten Konflikte, beim Lesen gerechnet (E-31)

    AddLessonInput:
      type: object
      description: Handaufbau (W-3) — keine Lehrkraft im Body, sie folgt aus der Fachzuordnung der Klasse
      required: [classId, subjectId, timeslotId, roomId]
      properties:
        classId: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64 }
        timeslotId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }

    PatchLessonInput:
      type: object
      description: nur gesendete Felder ändern sich; timeslotId/roomId setzen legt die Stunde fest, außer pinned steht im Body
      properties:
        timeslotId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }
        pinned: { type: boolean }

    StartSolveInput:
      type: object
      properties:
        classId:
          type: integer
          format: int64
          description: 'Kann (E-40, nach R1): nur diese Klasse neu berechnen; alle anderen Stunden gelten für den Lauf als festgelegt. Fehlt: ganzer Plan.'

    AcceptDraftInput:
      type: object
      properties:
        validFrom:
          type: string
          format: date
          description: |
            Kann (E-40, nach R1): der neue Plan gilt erst ab diesem Datum; bis dahin bleibt der
            bisherige Plan in den Wochensichten. Fehlt: gilt ab heute — die Antwort trägt dann den
            heutigen Tag, seit 1.4.0 steht bei jedem angenommenen Plan ein Datum. Ein Datum **vor
            heute** ist 400 `validation` mit Feld `validFrom`: ein Beginn in der Vergangenheit
            schriebe die Zeitleiste rückwirkend um.
        validUntil:
          type: string
          format: date
          description: |
            Kann (seit 1.4.0, #115): letzter Tag einschließlich, an dem der neue Plan gilt. Fehlt:
            unbegrenzt. Liegt das Ende vor dem Beginn, ist das 400 `validation` mit Feld `validUntil`.

    RepairInput:
      type: object
      description: Body von POST /api/draft/repair (#110, seit 1.2.0) — die Konfliktstunde
      required: [lessonId]
      properties:
        lessonId: { type: integer, format: int64 }

    RepairMoveDto:
      type: object
      description: 'Eine Stunde wandert in dieses Zeitfenster und diesen Raum; übernommen per PATCH /api/draft/lessons/{lessonId} mit pinned: false'
      required: [lessonId, timeslotId, roomId]
      properties:
        lessonId: { type: integer, format: int64 }
        timeslotId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }

    RepairProposalDto:
      type: object
      description: Ein Vorschlag (#110, E-53) — eine Vorschau, nichts davon ist gespeichert
      required: [level, label, moves, hardConflictsAfter, score]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
          description: '1 = nur die Konfliktstunde, 2 = dazu die Stunden derselben Klasse am selben Tag, 3 = dazu alle Stunden der Lehrkraft und des Raums an diesem Tag'
        label: { type: string, description: deutscher Text der Stufe }
        moves:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RepairMoveDto'
        hardConflictsAfter:
          type: integer
          description: harte Konflikte im ganzen Entwurf, wenn der Vorschlag übernommen ist
        score:
          type: [string, 'null']
          description: Timefold-Score des Laufs, z. B. `0hard/0medium/-2soft`

    RepairResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          description: nach Stufe aufsteigend; leer, wenn kein Lauf eine Stunde bewegt hat
          items:
            $ref: '#/components/schemas/RepairProposalDto'

    EntryOriginal:
      type: object
      description: |
        Nur die geänderten Werte sind gesetzt — Vertretung (Lehrkraft/Raum), Verlegung
        (Datum/Position). Die übrigen Felder stehen als `null` in der Antwort; deshalb ist jedes
        Feld nullable (klargestellt im NACHTRAG 05.09.). In der Schülersicht
        (`GET /api/me/class-week`) sind `teacherId` und `roomId` **immer** `null` — dort stehen nur
        Kürzel (E-50).
      properties:
        teacherId: { type: [integer, 'null'], format: int64 }
        teacherShort: { type: [string, 'null'] }
        roomId: { type: [integer, 'null'], format: int64 }
        roomShort: { type: [string, 'null'] }
        date: { type: [string, 'null'], format: date }
        position: { type: [integer, 'null'], minimum: 1 }

    EntryDto:
      type: object
      description: Eine Stunde an einem Kalendertag, fertig aufgelöst — Web und App färben und beschriften nur (ui.md)
      required: [date, timeslotId, day, position, lessonId, classId, classShort, subjectShort, subjectColor, teacherId, teacherShort, roomId, roomShort, kind, original, reasons, exceptionId]
      properties:
        date: { type: string, format: date }
        timeslotId: { type: integer, format: int64 }
        day:
          $ref: '#/components/schemas/Weekday'
        position: { type: integer, minimum: 1 }
        lessonId: { type: [integer, 'null'], format: int64, description: null bei einer Zusatzstunde (ADDED) }
        classId: { type: integer, format: int64 }
        classShort: { type: string }
        subjectShort: { type: string }
        subjectColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        teacherId: { type: [integer, 'null'], format: int64, description: bei SUBSTITUTED/GIVEN_AWAY die vertretende Lehrkraft }
        teacherShort: { type: [string, 'null'] }
        roomId: { type: [integer, 'null'], format: int64 }
        roomShort: { type: [string, 'null'] }
        kind:
          $ref: '#/components/schemas/EntryKind'
        original:
          oneOf:
            - $ref: '#/components/schemas/EntryOriginal'
            - type: 'null'
        reasons:
          type: array
          description: Anlässe der auslösenden Ereignisse (bei einer Verlegung zuerst „verlegt → Mi 1.")
          items: { type: string }
        exceptionId: { type: [integer, 'null'], format: int64 }

    DayDto:
      type: object
      required: [date, schoolDay, entries]
      properties:
        date: { type: string, format: date }
        schoolDay: { type: boolean, description: 'false = unterrichtsfrei (Ferien, Feiertag): keine Einträge' }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EntryDto'

    WeekDto:
      type: object
      description: Kalenderwoche ab Montag; Tage = Unterrichtstage des Rasters (Mo–Fr, Sa nur wenn im Raster)
      required: [monday, days]
      properties:
        monday: { type: string, format: date }
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayDto'

    AffectedDto:
      type: object
      required: [date, lessonId, classShort, position]
      properties:
        date: { type: string, format: date }
        lessonId: { type: integer, format: int64 }
        classShort: { type: string }
        position: { type: integer, minimum: 1 }

    ExtraLessonInput:
      type: object
      description: Angaben einer Zusatzstunde (Ereignis EXTRA_LESSON)
      required: [date, timeslotId, classId, subjectId, teacherId, roomId]
      properties:
        date: { type: string, format: date }
        timeslotId: { type: integer, format: int64 }
        classId: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64 }
        teacherId: { type: integer, format: int64 }
        roomId: { type: integer, format: int64 }

    EventDto:
      type: object
      required: [id, kind, teacherId, roomId, dateFrom, dateTo, reason, createdAt, createdBy, affected, hint]
      properties:
        id: { type: integer, format: int64 }
        kind:
          $ref: '#/components/schemas/EventKind'
        teacherId: { type: [integer, 'null'], format: int64, description: nur bei TEACHER_ABSENCE }
        roomId: { type: [integer, 'null'], format: int64, description: nur bei ROOM_BLOCKED }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        reason: { type: string, description: 'Anlass (Freitext), erscheint als Grund in Wochensicht und Verlauf' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: Benutzername des erfassenden Kontos }
        affected:
          type: array
          description: betroffene Stunden des aktiven Plans im Zeitraum (berechnet, nicht gespeichert)
          items:
            $ref: '#/components/schemas/AffectedDto'
        hint: { type: [string, 'null'], description: 'gesetzt, wenn keine Stunde betroffen ist (Ausnahme aus W-5) oder bei einer Zusatzstunde' }
        extra:
          oneOf:
            - $ref: '#/components/schemas/ExtraLessonInput'
            - type: 'null'

    EventInput:
      type: object
      required: [kind, dateFrom, dateTo, reason]
      properties:
        kind:
          $ref: '#/components/schemas/EventKind'
        teacherId: { type: [integer, 'null'], format: int64, description: Pflicht bei TEACHER_ABSENCE }
        roomId: { type: [integer, 'null'], format: int64, description: Pflicht bei ROOM_BLOCKED }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date, description: 'nicht vor dateFrom; bei EXTRA_LESSON gleich extra.date' }
        reason: { type: string, minLength: 1, maxLength: 255 }
        extra:
          oneOf:
            - $ref: '#/components/schemas/ExtraLessonInput'
            - type: 'null'
          description: Pflicht bei EXTRA_LESSON

    PendingRow:
      type: object
      description: eine vertretungsbedürftige Stunde an einem Datum
      required: [date, lessonId, classShort, subjectShort, position, teacherShort, roomShort, reasons, eventIds]
      properties:
        date: { type: string, format: date }
        lessonId: { type: integer, format: int64 }
        classShort: { type: string }
        subjectShort: { type: string }
        position: { type: integer, minimum: 1 }
        teacherShort: { type: string }
        roomShort: { type: string }
        reasons:
          type: array
          items: { type: string }
        eventIds:
          type: array
          items: { type: integer, format: int64 }

    TeacherOption:
      type: object
      required: [id, shortName, name, teachesSubject]
      properties:
        id: { type: integer, format: int64 }
        shortName: { type: string }
        name: { type: string }
        teachesSubject: { type: boolean, description: unterrichtet das Fach der Stunde — diese stehen zuerst }

    RoomOption:
      type: object
      required: [id, name, roomType, matchesRequirement]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        roomType: { type: string }
        matchesRequirement: { type: boolean, description: Raumart passt zur Raumanforderung des Fachs (ohne Anforderung immer true) — diese stehen zuerst }

    OptionsDto:
      type: object
      required: [teachers, rooms]
      properties:
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/TeacherOption'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomOption'

    ExceptionDto:
      type: object
      required: [id, date, lessonId, kind, substituteTeacherId, substituteRoomId, newDate, newTimeslotId, eventIds, conflicts]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, format: date }
        lessonId: { type: [integer, 'null'], format: int64, description: null nur bei ADDED }
        kind:
          $ref: '#/components/schemas/ExceptionKind'
        substituteTeacherId: { type: [integer, 'null'], format: int64 }
        substituteRoomId: { type: [integer, 'null'], format: int64 }
        newDate: { type: [string, 'null'], format: date, description: bei MOVE das Zieldatum; bei ADDED das Datum der Zusatzstunde }
        newTimeslotId: { type: [integer, 'null'], format: int64 }
        eventIds:
          type: array
          items: { type: integer, format: int64 }
        conflicts:
          type: array
          description: Folgekonflikte des Tages — Daten, kein Fehler; nur in der Antwort von POST gefüllt
          items:
            $ref: '#/components/schemas/ConflictDto'

    ExceptionInput:
      type: object
      required: [date, lessonId, kind]
      properties:
        date: { type: string, format: date }
        lessonId: { type: integer, format: int64, description: Stunde des aktiven Plans }
        kind:
          $ref: '#/components/schemas/ExceptionKind'
        substituteTeacherId: { type: [integer, 'null'], format: int64, description: 'SUBSTITUTION: Lehrkraft und/oder Raum, mindestens eines' }
        substituteRoomId: { type: [integer, 'null'], format: int64 }
        newDate: { type: [string, 'null'], format: date, description: 'MOVE: Pflicht' }
        newTimeslotId: { type: [integer, 'null'], format: int64, description: 'MOVE: Pflicht' }
        eventIds:
          type: array
          description: Anlässe; fehlt die Liste, nimmt der Server alle Ereignisse, die die Stunde an dem Datum betreffen
          items: { type: integer, format: int64 }

    ChangelogItem:
      type: object
      required: [id, timestamp, action, date, position, classShort, oldAssignment, newAssignment, reasons, username]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        action:
          $ref: '#/components/schemas/ChangelogAction'
        date: { type: [string, 'null'], format: date, description: Datum der Stunde; bei TIMETABLE_ACCEPTED der Gültigkeitsbeginn oder null }
        position: { type: [integer, 'null'], minimum: 1 }
        classShort: { type: [string, 'null'] }
        oldAssignment: { type: string, description: 'Text-Schnappschuss, z. B. "Meyer / R101"' }
        newAssignment: { type: string, description: 'z. B. "Schulz / R204", "entfällt", "Di, 3. Stunde"' }
        reasons: { type: string, description: 'alle Anlässe, mit "; " getrennt' }
        username: { type: string }

    ChangelogPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogItem'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    HolidayDto:
      type: object
      required: [id, name, dateFrom, dateTo, kind]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: [Herbstferien] }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        kind:
          $ref: '#/components/schemas/HolidayKind'

    HolidayInput:
      type: object
      required: [name, dateFrom, dateTo, kind]
      properties:
        name: { type: string, minLength: 1 }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        kind:
          $ref: '#/components/schemas/HolidayKind'

    HolidayPresetYearsDto:
      type: object
      required: [state, schoolYears]
      properties:
        state: { type: string, minLength: 2, maxLength: 2, description: 'Bundesland aus GET /api/config', examples: [SH] }
        schoolYears:
          type: array
          description: Schuljahre mit Vorlage, älteste zuerst; leer = für dieses Bundesland liegt keine bei
          items: { type: string, pattern: '^\d{4}/\d{2}$' }

    HolidayPresetInput:
      type: object
      required: [schoolYear]
      properties:
        schoolYear:
          type: string
          pattern: '^\d{4}/\d{2}$'
          description: Schuljahr in der Schreibweise der KMK
          examples: ['2026/27']

    HolidayPresetResultDto:
      type: object
      required: [added, skipped, state, schoolYear]
      properties:
        added: { type: integer, description: neu angelegte Zeiträume }
        skipped: { type: integer, description: 'übersprungen, weil derselbe Zeitraum mit derselben Bezeichnung schon stand' }
        state: { type: string, examples: [SH] }
        schoolYear: { type: string, examples: ['2026/27'] }
        
    MasterDataExport:
      type: object
      description: |
        Alle Grunddaten der Schule als ein Dokument (Format-Version 1). Die Kennungen sind
        innerhalb des Dokuments selbstkonsistent — Verweise zeigen auf Einträge derselben
        Datei. `plannedHours` und `warnings` in den enthaltenen DTOs sind abgeleitet und
        dienen nur der Anzeige im exportierenden System; der Import ignoriert sie.
      required: [version, exportedAt, subjects, teachers, rooms, classes, timeslots, rules, holidays]
      properties:
        version:
          type: string
          enum: ['1']
          description: Format-Version des Dokuments. Bestimmt, wie der Import es liest.
        exportedAt: { type: string, format: date-time }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/SubjectDto' }
        teachers:
          type: array
          items: { $ref: '#/components/schemas/TeacherDto' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/RoomDto' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/ClassDto' }
        timeslots:
          type: array
          items: { $ref: '#/components/schemas/TimeslotDto' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RuleDto' }
        holidays:
          type: array
          items: { $ref: '#/components/schemas/HolidayDto' }

    MasterDataImport:
      description: Body von POST /api/masterdata/import — derselbe Aufbau wie MasterDataExport, dazu `replace`.
      allOf:
        - $ref: '#/components/schemas/MasterDataExport'
        - type: object
          required: [replace]
          properties:
            replace:
              type: boolean
              default: false
              description: true = vorhandene Grunddaten vorher löschen (Pflicht, wenn schon welche da sind).

    MasterDataImportResult:
      type: object
      required: [subjects, teachers, rooms, classes, timeslots, rules, holidays, warnings]
      properties:
        subjects: { type: integer, minimum: 0 }
        teachers: { type: integer, minimum: 0 }
        rooms: { type: integer, minimum: 0 }
        classes: { type: integer, minimum: 0 }
        timeslots: { type: integer, minimum: 0 }
        rules: { type: integer, minimum: 0 }
        holidays: { type: integer, minimum: 0 }
        warnings:
          type: array
          description: deutsche Hinweise — aktuell leer, für spätere Formatänderungen vorgesehen.
          items: { type: string }
