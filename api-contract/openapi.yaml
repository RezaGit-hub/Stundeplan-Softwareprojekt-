            schema:
              $ref: '#/components/schemas/ExceptionInput'
            example: { date: '2026-09-21', lessonId: 1, kind: SUBSTITUTION, substituteTeacherId: 2, substituteRoomId: 2, eventIds: [1, 2] }
      responses:
        '201':
          description: Ausnahme angelegt; `conflicts[]` sind Folgekonflikte des Tages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionDto'
              example: { id: 1, date: '2026-09-21', lessonId: 1, kind: SUBSTITUTION, substituteTeacherId: 2, substituteRoomId: 2, newDate: null, newTimeslotId: null, eventIds: [1, 2], conflicts: [] }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          description: Für diese Stunde gibt es an diesem Tag schon eine Ausnahme
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: urn:pushnpull:problem:exception-exists
                title: Ausnahme existiert bereits
                status: 409
                detail: Für diese Stunde gibt es am 21.09.2026 schon eine Ausnahme. Erst aufheben, dann neu anlegen.

  /api/exceptions/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    delete:
      tags: [Vertretung]
      operationId: deleteException
      summary: Ausnahme aufheben
      description: |
        Die Stunde wird wieder vertretungsbedürftig, solange das Ereignis besteht. Schreibt den
        Verlaufseintrag `EXCEPTION_DELETED`; `oldAssignment` nennt, was aufgehoben wird — bei `MOVE` das
        Ziel („Mi, 1. Stunde"), bei `CANCEL` „entfällt", sonst die Belegung. Eine Zusatzstunde (`ADDED`)
        geht diesen Weg **nicht**: sie gehört zu ihrem Ereignis und wird mit `DELETE /api/events/{id}`
        zurückgenommen; hier antwortet der Server 400 `validation`.
      x-role: PLANNING
      responses:
        '204':
          description: aufgehoben
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/changelog:
    get:
      tags: [Verlauf]
      operationId: getChangelog
      summary: Änderungsverlauf lesen (W-7)
      description: |
        Chronologisch absteigend, seitenweise (`page` ab 0, `size` Standard 50). Filter `from`/`to` wirken
        auf das Datum der Stunde, `classId`, `teacherId` (Lehrkraft der Regelplanstunde) und `lessonId`.
        Belegungen stehen als Text-Schnappschuss, damit der Eintrag nach dem Deaktivieren oder Umbenennen
        von Grunddaten lesbar bleibt. **Es gibt kein PUT und kein DELETE** (T-W7.1).
        Beispiel: Filter Klasse 7a — genau ein Vertretungseintrag mit beiden Anlässen.
      x-role: PLANNING
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: classId, in: query, required: false, schema: { type: integer, format: int64 }, example: 1 }
        - { name: teacherId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: lessonId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: eine Seite des Verlaufs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogPage'
              example:
                items:
                  - id: 2
                    timestamp: '2026-09-18T09:20:00Z'
                    action: EXCEPTION_CREATED
                    date: '2026-09-21'
                    position: 1
                    classShort: 7a
                    oldAssignment: Meyer / R101
                    newAssignment: Schulz / R204
                    reasons: Krankmeldung; Wasserschaden
                    username: admin
                page: 0
                size: 50
                total: 1
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

