                lessons:
                  - { id: 1, classId: 1, classShort: 7a, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 1, roomShort: R101, timeslotId: 1, day: MO, position: 1, pinned: true }
                  - { id: 2, classId: 1, classShort: 7a, subjectId: 2, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 1, roomShort: R101, timeslotId: 2, day: MO, position: 2, pinned: true }
                conflicts: []
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/timetable/week:
    get:
      tags: [Plan]
      operationId: getWeek
      summary: Aufgelöste Kalenderwoche lesen (W-4, W-5)
      description: |
        Regelplan des am Datum gültigen aktiven Plans, überlagert mit Ereignissen und datierten Ausnahmen
        der Woche; unterrichtsfreie Tage haben `schoolDay: false` und keine Einträge. `date` darf ein
        beliebiger Tag der Woche sein; die Antwort beginnt immer am Montag. Sichten: `SCHOOL` (alle
        Einträge, `id` entfällt), `CLASS`, `TEACHER`, `ROOM` (Raumsicht, Musskriterium E-39) mit `id`.
        In der Sicht `TEACHER` erscheint eine vertretene Stunde der Lehrkraft als `GIVEN_AWAY`.
        Das Beispiel ist die Sicht `SCHOOL` der Woche vom 21.09.2026 nach dem Leitszenario.
      x-role: PLANNING
      parameters:
        - name: date
