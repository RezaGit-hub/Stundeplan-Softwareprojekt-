        Stunden ergänzen, Solver **asynchron** starten, 202 sofort; Stand über `GET /api/drafts/{id}`
        (`status: SOLVING` → alle 2 s). Es läuft **ein** Lauf zugleich je Entwurf; andere Entwürfe bleiben
        bearbeitbar. Fehler (409): `master-data-incomplete`, `pinned-contradiction`, `solving`.
        Kann (E-40): `classId` begrenzt den Lauf auf eine Klasse.
