  /api/sample-data:
    post:
      tags: [Konfiguration]
      operationId: loadSampleData
      summary: Beispieldatenbestand laden
      description: |
        Lädt eine vollständige Beispielschule (12 Klassen, 24 Lehrkräfte, 18 Räume) inklusive eines
        angenommenen, gefüllten aktiven Plans (E-46) — der Plan wird beim Laden vom Solver berechnet,
        der Aufruf dauert deshalb etwa zehn Sekunden. Sind schon Grunddaten vorhanden, antwortet der
        Server mit 409 `data-exists`; mit `replace: true` ersetzt er alles: Grunddaten, Pläne,
        Ereignisse, Ausnahmen, Verlauf und Lehrkraft-Konten (das Konto der Planung bleibt). Regelwerk
        und Systemkonfiguration bleiben unverändert. Konten für Lehrkräfte werden nicht angelegt.
      x-role: PLANNING
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleDataRequest'
            example: { replace: false }
      responses:
        '200':
          description: Beispieldaten geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataResult'
              example: { classes: 12, teachers: 24, rooms: 18 }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          description: Es sind bereits Daten vorhanden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: urn:pushnpull:problem:data-exists
                title: Es sind bereits Daten vorhanden
                status: 409
                detail: Die Datenbank enthält bereits Grunddaten. Zum Ersetzen „replace" setzen.
  
