  # =====================================================================================================
  # v1 — Planung, Wochensichten, Entwurf, Berechnung, Ereignisse, Vertretung, Verlauf, Ferien (T-403)
  # Beispielzustand: Testdaten des Pflichtenhefts NACH dem Leitszenario (Woche 21.–25.09.2026):
  # Meyer fällt am 21.09. aus (Ereignis 1 „Krankmeldung"), R101 ist am 21.09. gesperrt (Ereignis 2
  # „Wasserschaden"), die 1. Stunde der 7a wird von Schulz in R204 vertreten (Ausnahme 1). Zusätzlich:
  # die Dienstagsstunde der 7a ist auf Mittwoch verlegt (Ausnahme 2) und am Donnerstag gibt es eine
  # Zusatzstunde 9c Mathematik (Ereignis 3, Ausnahme 3). So kommen in den Wochenbeispielen alle sieben
  # kind-Werte vor. Stunden-IDs: aktiver Plan 1–7, Entwurf 11–18. Zeitfenster-IDs wie in /api/timegrid.
  # =====================================================================================================

  /api/timetable:
    get:
      tags: [Plan]
      operationId: getTimetable
      summary: Aktiven Regelplan lesen
      description: |
        Der aktive Plan aller Klassen (Wochenmuster) mit den **aktuell berechneten** Konflikten — der
        `ConflictChecker` läuft bei jedem Lesen, damit Grunddatenänderungen sofort sichtbar werden (W-1).
        Vor der ersten Annahme: `id: null`, leere Listen. Für die Rolle Lehrkraft 403 (Zugriffsschutz).

        **Welcher Plan (seit 1.4.0, #115):** der, der **heute** gilt. Gibt es den nicht — weil der
        laufende Zeitraum abgelaufen ist oder der nächste erst beginnt —, dann der aktive Plan mit dem
        nächsten künftigen Beginn; gibt es auch den nicht, `id: null`. Alle aktiven Pläne mit ihren
        Zeiträumen listet `GET /api/timetables`.
      x-role: PLANNING
      responses:
        '200':
          description: aktiver Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableDto'
              example:
                id: 1
                acceptedAt: '2026-09-14T15:00:00Z'
                validFrom: null
                validUntil: null
                lessons:
                  - { id: 1, classId: 1, classShort: 7a, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 1, roomShort: R101, timeslotId: 1, day: MO, position: 1, pinned: true }
                  - { id: 2, classId: 1, classShort: 7a, subjectId: 2, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 1, roomShort: R101, timeslotId: 2, day: MO, position: 2, pinned: true }
                  - { id: 3, classId: 1, classShort: 7a, subjectId: 3, subjectShort: Ph, subjectColor: '#F57C00', teacherId: 1, teacherShort: MEY, roomId: 3, roomShort: P1, timeslotId: 4, day: MO, position: 4, pinned: true }
                  - { id: 4, classId: 2, classShort: 8b, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 2, roomShort: R204, timeslotId: 2, day: MO, position: 2, pinned: true }
                  - { id: 5, classId: 2, classShort: 8b, subjectId: 2, subjectShort: De, subjectColor: '#388E3C', teacherId: 3, teacherShort: WEB, roomId: 2, roomShort: R204, timeslotId: 4, day: MO, position: 4, pinned: true }
                  - { id: 6, classId: 2, classShort: 8b, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 2, roomShort: R204, timeslotId: 5, day: MO, position: 5, pinned: true }
                  - { id: 7, classId: 1, classShort: 7a, subjectId: 1, subjectShort: Ma, subjectColor: '#1976D2', teacherId: 1, teacherShort: MEY, roomId: 1, roomShort: R101, timeslotId: 8, day: TU, position: 1, pinned: true }
                conflicts: []
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/timetables:
    get:
      tags: [Plan]
      operationId: listTimetables
      summary: Alle aktiven Pläne mit ihrem Zeitraum (seit 1.4.0, #115)
      description: |
        Die angenommenen Pläne, die noch gelten oder erst künftig gelten — frühester Beginn zuerst,
        ohne Stunden. Seit 1.4.0 darf es mehrere geben; ihre Zeiträume überschneiden sich nie
        (Ausschlussbedingung in der Datenbank). `current: true` trägt der Plan, der **heute** gilt —
        höchstens einer, in einer Lücke zwischen zwei Zeiträumen keiner. Leere Liste = noch nichts
        angenommen (ein Zustand, kein Fehler). Ersetzte Pläne stehen **nicht** in der Liste; einzeln
        lesbar bleiben sie über `GET /api/timetables/{id}`. Ein Plan, dessen `validUntil` verstrichen
        ist, wird erst beim nächsten Annehmen ins Archiv geräumt und steht bis dahin noch hier — dann
        ohne `current`, weil er an keinem Tag mehr gilt.
      x-role: PLANNING
      responses:
        '200':
          description: die aktiven Pläne, frühester Beginn zuerst
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimetableSummaryDto'
              example:
                - { id: 1, acceptedAt: '2026-09-14T15:00:00Z', validFrom: null, validUntil: '2027-01-31', current: true }
                - { id: 2, acceptedAt: '2026-09-15T10:30:00Z', validFrom: '2027-02-01', validUntil: null, current: false }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

