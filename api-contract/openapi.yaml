        aus einem Parameter — der einzige Parameter ist `date`. Ein Konto ohne Klasse (Planung,
        Lehrkraft) bekommt 404. `date` fehlt → aktuelle Woche.

        **Serverseitig gefiltert (datensparsam):**
        - `reasons` ist **immer leer**. Der Anlass einer Vertretung ist ein Gesundheitsdatum der
          Lehrkraft; mehrere Aufsichtsbehörden nennen seine Anzeige unzulässig. Die *Art* bleibt:
          `NEEDS_SUBSTITUTION` heißt in der Oberfläche „Vertretung offen", ohne Grund.
