    post:
      tags: [Vertretung]
      operationId: createException
      summary: Vertretung, Raumwechsel, Verlegung oder Entfall für einen Kalendertag anlegen (W-6, W-7)
      description: |
        Eine Ausnahme je Stunde und Datum. `SUBSTITUTION` trägt `substituteTeacherId` und/oder
        `substituteRoomId` in **einer** Zeile (Leitszenario: ein Arbeitsgang, T-W6.1); `MOVE` braucht
        `newDate` und `newTimeslotId`; `CANCEL` nichts weiter; `ADDED` wird nicht hier, sondern über ein
        Ereignis `EXTRA_LESSON` angelegt (400). `eventIds[]` sind die Anlässe; fehlen sie, nimmt der Server
        alle Ereignisse, die die Stunde an dem Datum betreffen. Der Server prüft Folgekonflikte des Tages
        auf der aufgelösten Woche und liefert sie als `conflicts[]` — Daten, kein Fehler; gespeichert wird
        immer. Schreibt den Verlaufseintrag `EXCEPTION_CREATED` mit alter und neuer Belegung (T-W7.1).
        Zweite Ausnahme für dieselbe Stunde am selben Tag: 409 `exception-exists` (erst aufheben).
