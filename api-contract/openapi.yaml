  /api/drafts/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Entwurf]
      operationId: acceptDraftById
      summary: Diesen Entwurf annehmen — er wird der aktive Plan (W-8, seit 1.3.0)
      description: |
        Wie `POST /api/draft/accept`, für den Entwurf mit dieser Kennung: berührte Vorgänger werden
        verkürzt oder archiviert, dieser Entwurf → `ACTIVE`, Verlaufseintrag `TIMETABLE_ACCEPTED`. **Andere Entwürfe
        bleiben stehen** — die Planung nimmt sie später an oder verwirft sie. **Harte Konflikte
        blockieren**: 409 `draft-has-conflicts` mit `conflicts[]` (die harten); erst lösen (z. B.
        `POST …/repair`), dann annehmen. Weiche Konflikte blockieren nicht. Während einer Berechnung 409
        `solving`. `warnings[]`, offene Stunden und verfallende Vertretungen wie beim Singular-Pfad.
        Ein Entwurf **aus der Ablage** darf angenommen werden (#116); der angenommene Plan liegt nie
        in ihr.

        **Gültigkeitszeitraum (seit 1.4.0, #115).** `validFrom` ist der Beginn (fehlt: heute),
        `validUntil` das Ende einschließlich (fehlt: unbegrenzt); `validUntil` vor dem Beginn ist 400
        `validation` mit Feld `validUntil`, `validFrom` **vor heute** ist 400 `validation` mit Feld
        `validFrom`. Die Antwort trägt `validFrom` immer als Datum — bei „ab sofort" den heutigen Tag.
        Berührt wird nur, was sich mit dem gewünschten Zeitraum überschneidet:

        - Ein Plan, der **früher begonnen** hat, endet am Tag vor `validFrom` und bleibt aktiv — „der
          alte Plan gilt bis zu seinem Ende weiter". Liegt er damit ganz in der Vergangenheit, wird er
          archiviert.
        - Ein Plan, der **heute schon begonnen** hat und nicht früher als der neue beginnt (eben erst
