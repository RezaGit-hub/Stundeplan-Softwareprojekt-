  /api/draft/solve:
    post:
      tags: [Entwurf]
      operationId: startSolve
      summary: Berechnung starten (W-8, W-9)
      description: |
        Prüft die Vorbedingungen, ergänzt je Klasse und Fach die fehlenden Stunden als offene, nicht
        festgelegte Zeilen und startet den Solver **asynchron**; die Antwort 202 kommt sofort. Rechenzeit
        je Lauf = `maxSolveSeconds` aus `GET /api/config`; die Berechnung endet spätestens damit und liefert
        das bis dahin beste Ergebnis (T-W8.1). Festgelegte Stunden bleiben unverändert (T-W9.1). Den Stand
        liefert `GET /api/draft` (`status: SOLVING` → alle 2 s abfragen). Ergebnis: jede Stunde ist belegt
        oder offen, kein dritter Zustand; keine Doppelbelegung von Raum, Lehrkraft oder Klasse.

        Fehler (409): `master-data-incomplete` mit `missing[]` (eine aktive Klasse hat kein Fach),
        `pinned-contradiction` mit `conflicts[]` (harte Konflikte allein zwischen festgelegten Stunden),
        `solving` (läuft schon).

        **Kann (E-40, nach Rückfrage R1):** `classId` begrenzt die Neuberechnung auf eine Klasse; alle
        Stunden anderer Klassen gelten für diesen Lauf als festgelegt. Ohne Body oder mit `{}`: ganzer Plan.
      x-role: PLANNING
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSolveInput'
            example: {}
      responses:
        '202':
          description: Berechnung gestartet; Stand über GET /api/draft
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          description: Vorbedingung verletzt, Berechnung läuft schon oder der Entwurf liegt in der Ablage (`master-data-incomplete`, `pinned-contradiction`, `solving`, `draft-finished` seit 1.4.0)
          content:
