  /api/holidays/preset-years:
    get:
      tags: [Ferien]
      operationId: listHolidayPresetYears
      summary: Schuljahre der mitgelieferten Vorlage (Kann, E-51)
      description: |
        Die Schuljahre, für die zum Bundesland aus `GET /api/config` eine Ferien- und
        Feiertagsvorlage mitgeliefert wird. Die Vorlage ist **Daten, kein Dienst**: sie steht in der
        Tabelle `holiday_preset` (Migration V8, erzeugt aus der Recherche), es wird zur Laufzeit
        nichts aus dem Internet geholt.

        Leeres `schoolYears` heißt: für dieses Bundesland liegt keine Vorlage bei — die Oberfläche
        blendet „Vorlage laden" dann aus. Kein Bundesland ist im Code verdrahtet.
      x-role: PLANNING
      responses:
        '200':
          description: verfügbare Schuljahre, älteste zuerst
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayPresetYearsDto'
              example: { state: SH, schoolYears: ['2026/27', '2027/28'] }
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/holidays/preset:
    post:
      tags: [Ferien]
      operationId: loadHolidayPreset
      summary: Ferien und Feiertage aus der Vorlage übernehmen (Kann, E-51)
      description: |
        Kopiert die mitgelieferten Zeiträume des in `GET /api/config` eingestellten Bundeslands für
        ein Schuljahr nach `holiday` — genau das, was `POST /api/rules/reset` für das Regelwerk tut.

        Der Aufruf ist **idempotent**: ein Zeitraum wird übersprungen, wenn schon einer mit derselben
        Bezeichnung und demselben Anfang und Ende steht. Ein zweiter Aufruf liefert also `added: 0`.
        Jeder übernommene Eintrag ist danach ein Zeitraum wie jeder andere und bleibt einzeln
        änderbar und löschbar.

        Enthalten sind die amtlichen Ferienblöcke und die landesweit geltenden Feiertage. **Nicht**
        enthalten sind Feiertage, die nur in einem Teilgebiet gelten (Fronleichnam in Teilen von
        Sachsen und Thüringen, Mariä Himmelfahrt in katholischen Gemeinden Bayerns, Augsburger
        Friedensfest), sowie bewegliche Ferientage — beides trägt die Schule von Hand nach.
      x-role: PLANNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayPresetInput'
            example: { schoolYear: '2026/27' }
      responses:
        '200':
          description: übernommen (`added`) und übersprungen (`skipped`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayPresetResultDto'
              example: { added: 14, skipped: 0, state: SH, schoolYear: '2026/27' }
        '400':
          $ref: '#/components/responses/Validation400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/PresetMissing409'

