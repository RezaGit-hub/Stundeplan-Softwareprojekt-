        400 `validation` mit dem Feldnamen liefert der Server außerdem, wenn eine Kennung ins Leere zeigt
        (`substituteTeacherId`, `substituteRoomId`, `newTimeslotId`, `eventIds`), wenn eine Vertretung
        weder Lehrkraft noch Raum ändert, wenn die Vertretungslehrkraft an dem Datum selbst ausfällt oder
        der Vertretungsraum gesperrt ist, und wenn bei `MOVE` das Zielzeitfenster nicht zum Wochentag von
        `newDate` gehört. 404 `not-found`, wenn die Stunde an diesem Kalendertag nicht liegt — anderer
        Wochentag, unterrichtsfreier Tag oder Ferien.
      x-role: PLANNING
      requestBody:
