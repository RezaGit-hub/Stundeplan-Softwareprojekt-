        - name: view
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/View'
          example: SCHOOL
        - name: id
          in: query
          required: false
          description: Klassen-, Lehrkraft- oder Raum-ID; Pflicht bei allen Sichten außer SCHOOL (sonst 400)
          schema: { type: integer, format: int64 }
          example: 1
      responses:
