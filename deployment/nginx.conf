# nginx im Container `web`: liefert das gebaute Frontend und reicht /api/ an das Backend weiter.
# Wird von frontend/Dockerfile nach /etc/nginx/conf.d/default.conf kopiert.
# Browser und App sprechen nur mit diesem Server — gleicher Ursprung, deshalb kein CORS.
#
# Zwei Ergaenzungen vom 05.09. (Befunde SICHERHEIT-3 und SICHERHEIT-8):
#  * Sicherheitskopfzeilen samt Content-Security-Policy. Das Sitzungstoken liegt seit F-5a im
#    localStorage; ohne CSP koennte jedes eingeschleuste Skript es lesen.
#  * Ein Zaehler fuer POST /api/auth/login. Der Server kennt keine Sperre nach n Fehlversuchen; zehn
#    Versuche je Minute und Adresse machen Durchprobieren unbrauchbar, ohne jemanden auszusperren.
#
# Achtung nginx-Regel: `add_header` in einem Block ERSETZT die geerbten Kopfzeilen des Elternblocks.
# Die Sicherheitskopfzeilen stehen deshalb in JEDEM Block, der eigene `add_header` hat.

# Zaehler fuer die Anmeldung: 10 Versuche je Minute und Adresse, kurze Spitzen bis 5 werden gepuffert.
# 1 MB Zustand reichen fuer rund 16.000 Adressen — die Schule hat weniger.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # --- Sicherheitskopfzeilen (Befund SICHERHEIT-3, 05.09.) ---------------------------------------
    # CSP: alles nur vom eigenen Ursprung. `script-src` erlaubt zusaetzlich genau das eine Inline-Skript
    # aus index.html (Themenwahl vor dem ersten Bild) ueber seinen Hash — wer es aendert, muss den Hash
    # neu berechnen, sonst blockiert der Browser es stillschweigend:
    #   node -e "const h=require('crypto').createHash('sha256');h.update(require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]);console.log('sha256-'+h.digest('base64'))"
    # `style-src` braucht 'unsafe-inline', weil React Stilangaben als style-Attribut setzt (Fachfarben).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-x8BKQ5i6xKdCzFYAYwIlMjyqC9PjMQ2lE1XZ6/7rO+c='; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Anmeldung: derselbe Weiterleitungsblock wie /api/, zusaetzlich der Zaehler von oben.
    # Wer zu schnell klopft, bekommt 429 — der Client zeigt die Meldung des Servers.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST-API. `backend` ist der Dienstname aus docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Solver darf laenger rechnen als die nginx-Voreinstellung von 60 s.
        proxy_read_timeout 120s;
    }

    # Gebaute Dateien mit Hash im Namen duerfen lange im Browser bleiben.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    # --- Sicherheitskopfzeilen (Befund SICHERHEIT-3, 05.09.) ---------------------------------------
    # CSP: alles nur vom eigenen Ursprung. `script-src` erlaubt zusaetzlich genau das eine Inline-Skript
    # aus index.html (Themenwahl vor dem ersten Bild) ueber seinen Hash — wer es aendert, muss den Hash
    # neu berechnen, sonst blockiert der Browser es stillschweigend:
    #   node -e "const h=require('crypto').createHash('sha256');h.update(require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]);console.log('sha256-'+h.digest('base64'))"
    # `style-src` braucht 'unsafe-inline', weil React Stilangaben als style-Attribut setzt (Fachfarben).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-x8BKQ5i6xKdCzFYAYwIlMjyqC9PjMQ2lE1XZ6/7rO+c='; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    }

    # Einseiten-Anwendung: jeder unbekannte Pfad bekommt index.html, react-router uebernimmt.
    # index.html nie cachen: sonst zeigt der Browser nach einem Deploy den alten Stand (gesehen 05.09.);
    # die Assets darunter sind per Hash im Namen versioniert und duerfen lange gecacht werden.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    # --- Sicherheitskopfzeilen (Befund SICHERHEIT-3, 05.09.) ---------------------------------------
    # CSP: alles nur vom eigenen Ursprung. `script-src` erlaubt zusaetzlich genau das eine Inline-Skript
    # aus index.html (Themenwahl vor dem ersten Bild) ueber seinen Hash — wer es aendert, muss den Hash
    # neu berechnen, sonst blockiert der Browser es stillschweigend:
    #   node -e "const h=require('crypto').createHash('sha256');h.update(require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]);console.log('sha256-'+h.digest('base64'))"
    # `style-src` braucht 'unsafe-inline', weil React Stilangaben als style-Attribut setzt (Fachfarben).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-x8BKQ5i6xKdCzFYAYwIlMjyqC9PjMQ2lE1XZ6/7rO+c='; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    }

    location / {
        add_header Cache-Control "no-cache";
    # --- Sicherheitskopfzeilen (Befund SICHERHEIT-3, 05.09.) ---------------------------------------
    # CSP: alles nur vom eigenen Ursprung. `script-src` erlaubt zusaetzlich genau das eine Inline-Skript
    # aus index.html (Themenwahl vor dem ersten Bild) ueber seinen Hash — wer es aendert, muss den Hash
    # neu berechnen, sonst blockiert der Browser es stillschweigend:
    #   node -e "const h=require('crypto').createHash('sha256');h.update(require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1]);console.log('sha256-'+h.digest('base64'))"
    # `style-src` braucht 'unsafe-inline', weil React Stilangaben als style-Attribut setzt (Fachfarben).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-x8BKQ5i6xKdCzFYAYwIlMjyqC9PjMQ2lE1XZ6/7rO+c='; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
