# Optionales HTTPS-Overlay. Ohne dieses File laeuft der Stack nur mit HTTP (lokales Testen).
# Mit diesem File zusaetzlich HTTPS auf HTTPSPORT.
# Auf der VM Gruppe 5: HTTPSPORT=8440 setzen (die VM-NAT macht daraus von aussen 1510).
#
# docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build

services:
  web:
    build:
      args:
        SSLCN: ${SSLCN:-134.245.1.240}
    ports:
      - "${HTTPSPORT:-8440}:8443"