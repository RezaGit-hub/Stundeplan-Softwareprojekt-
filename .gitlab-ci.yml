# Pipeline der Stundenplanung. Jeder Job hat ein Gegenstueck unter scripts/, das ohne Runner laeuft:
#
#   contract:lint      -> scripts/ci-contract-lint.sh
#   backend:test       -> scripts/ci-backend-test.sh   (Teil 1)
#   backend:integration-> scripts/ci-backend-test.sh   (Teil 2, Postgres im Docker-Netz)
#   frontend:build     -> scripts/ci-frontend-build.sh
#   image:build        -> scripts/ci-image.sh    (nur der Bau; das Ablegen in der Registry geht nur im Runner)
#   deploy:vm          -> scripts/deploy-vm.sh   (mit DRY_RUN=1 zeigt es jeden Befehl, ohne etwas zu tun)
#   alle vier CI-Jobs  -> scripts/ci-all.sh
#
# runner:check hat kein Gegenstueck: er beantwortet, was der Runner des CAU-GitLab kann, und das
# laesst sich nur dort feststellen.
#
# Regel: erst lokal scripts/ci-all.sh, dann pushen. Rote Pipeline blockiert jeden Merge;
# wer sie rot macht, repariert oder revertiert innerhalb einer Stunde.

stages:
  - build
  - test
  - image
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GIT_DEPTH: "20"

default:
  interruptible: true

# ---------------------------------------------------------------- Vorlagen

.gradle:
  image: eclipse-temurin:21-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push

.node:
  image: node:22-alpine

# ---------------------------------------------------------------- build

# Der API-Vertrag ist die eine Wahrheit der REST-API — er wird zuerst geprueft.
contract:lint:
  extends: .node
  stage: build
  cache:
    key: npm-api-contract
    paths:
      - api-contract/.npm
  script:
    - cd api-contract
    - npm ci --cache .npm --prefer-offline
    - npm run lint

# Typen, Lint, Tests und Produktionsbuild der Web-App. dist/ ist zugleich der Rueckfall,
# falls der Image-Build auf der VM einmal nicht durchlaeuft (siehe deployment/README-VM.md).
frontend:build:
  extends: .node
  stage: build
  cache:
    key: npm-frontend
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

android:build:
  stage: build
  image: docker:27-cli
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - apk add --no-cache bash
  script:
    - bash scripts/ci-android-build.sh
  artifacts:
    name: "android-$CI_COMMIT_REF_NAME"
    expire_in: 30 days
    paths:
      - app/stundenplan.apk
      - android-starter/app/build/outputs/apk/debug/app-debug.apk

# ---------------------------------------------------------------- test

# Schnelle Tests ohne Datenbank: Fachlogik, ArchUnit, Solver-Constraints, Sicherheitsregeln.
# `bootJar` haengt mit dran, damit das Jar als Artefakt bereitliegt (Rueckfall-Deploy).
backend:test:
  extends: .gradle
  stage: test
  # Kein Warten auf die Build-Stufe: die Tests brauchen weder dist/ noch das Jar der
  # anderen Jobs (Befund BETRIEB-8, 05.09.).
  needs: []
  script:
    - cd backend
    - ./gradlew test bootJar --no-daemon
  artifacts:
    when: always
    paths:
      - backend/build/libs/*.jar
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
    expire_in: 1 week

# Integrationstests gegen ein echtes PostgreSQL (kein H2) — dieselbe SQL, dieselben Migrationen.
backend:integration:
  extends: .gradle
  stage: test
  # Kein Warten auf die Build-Stufe: die Tests brauchen weder dist/ noch das Jar der
  # anderen Jobs (Befund BETRIEB-8, 05.09.).
  needs: []
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: timetable
    POSTGRES_USER: tt
    POSTGRES_PASSWORD: tt
    SPRING_PROFILES_ACTIVE: ci
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/timetable"
    SPRING_DATASOURCE_USERNAME: tt
    SPRING_DATASOURCE_PASSWORD: tt
  script:
    - cd backend
    - ./gradlew integrationTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/integrationTest/TEST-*.xml
    expire_in: 1 week

# ---------------------------------------------------------------- Runner pruefen

# Beantwortet die offene Frage Q-B-09 / Karte T-703 in einem Klick: Was kann der Runner des
# CAU-GitLab? Von Hand ausloesbar auf jedem Branch, schlaegt nie fehl, aendert nichts.
#
# Zu lesen sind vier Dinge in der Ausgabe:
#   1. "Server Version" bei `docker info` -> Docker-in-Docker geht, image:build laeuft.
#      "Cannot connect to the Docker daemon" -> DinD geht NICHT, dann Kaniko (siehe image:build).
#   2. CI_REGISTRY / CI_REGISTRY_IMAGE gefuellt -> die Container-Registry ist eingeschaltet.
#      Leer -> Abbilder koennen nirgends hin; die VM baut selbst (deploy:vm kann das).
#   3. CI_RUNNER_TAGS -> die Marken, die Jobs ggf. brauchen (`tags:` im Job).
#   4. free -m -> wie viel Speicher der Runner hat; Gradle im Container mag knapp werden.
#
# Ergebnis als eine Zeile in 07-Konzept/workflows/lernnotizen.md eintragen. Danach darf dieser Job weg.
runner:check:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    # Stillgelegt am 14.09.: Frage Q-B-09 / Karte T-703 ist beantwortet — der Runner
    # kann kein Docker-in-Docker. Erkenntnisse siehe 07-Konzept/workflows/lernnotizen.md.
    - when: never
  allow_failure: true
  script:
    - echo "--- docker ---"; docker info || echo "KEIN Docker-in-Docker in diesem Runner."
    - echo "--- registry ---"; echo "CI_REGISTRY=$CI_REGISTRY"; echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - echo "--- runner ---"; echo "CI_RUNNER_DESCRIPTION=$CI_RUNNER_DESCRIPTION"; echo "CI_RUNNER_TAGS=$CI_RUNNER_TAGS"
    - echo "--- speicher ---"; free -m || true; nproc || true

# ---------------------------------------------------------------- image

# Baut die beiden Abbilder und legt sie in die Container-Registry des CAU-GitLab.
# Der Registry-Pfad steht NICHT als Text im Repo: $CI_REGISTRY_IMAGE setzt GitLab selbst auf
# <registry-host>/ifi-ag-se/softwareprojekt/wsp3_1/web-app. Wer den Stack woanders betreibt,
# ueberschreibt REGISTRY_IMAGE in Settings -> CI/CD -> Variables; docker-compose.yml liest denselben
# Namen. Marken: die kurze Commit-Kennung (eindeutig, fuer Rollback) und `latest`.
#
# Nur auf main, von Hand, nie blockierend: ob der Shared Runner des RZ Docker-in-Docker kann, ist
# ungeprueft (siehe Kopf von scripts/ci-image.sh). Solange dieser Job nicht laeuft, baut die VM selbst —
# deploy:vm kann beides.
#
# Wenn `runner:check` zeigt, dass DinD fehlt: Kaniko baut Abbilder ohne Docker-Daemon und ohne
# privilegierten Runner. Dann `image` und `services` hier ersetzen durch
#   image: { name: gcr.io/kaniko-project/executor:debug, entrypoint: [""] }
# und je Abbild einen Aufruf
#   /kaniko/executor --context "$CI_PROJECT_DIR/backend" --dockerfile backend/Dockerfile
#                    --destination "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
# (fuer `web` Kontext "$CI_PROJECT_DIR" und --dockerfile frontend/Dockerfile). Die Anmeldung laeuft
# dann ueber /kaniko/.docker/config.json statt `docker login`. Quelle: GitLab-Doku „Use kaniko to
# build Docker images". UNGEPRUEFT — hier weder gebaut noch gelaufen.
image:build:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  rules:
    # Stillgelegt am 14.09.: Der Runner ist nicht privilegiert (siehe
    # `docker inspect 1c34e7b5fbf2` -> Privileged=false), DinD kann hier nicht laufen.
    # Deploy laeuft ueber deploy:vm, das auf der VM selbst baut.
    #
    # Zum Reaktivieren (falls der Runner spaeter privilegiert wird) die drei Zeilen unten
    # einkommentieren. Wichtig: die erste passende Regel gewinnt — solange `when: never`
    # als einzige Regel dasteht, erscheint der Job gar nicht erst in der Pipeline.
    #
    # - if: '$CI_COMMIT_BRANCH == "main"'
    #   when: manual
    #   allow_failure: true
    - when: never
  before_script:
    # Manche docker-Images bringen das compose-Plugin nicht mit.
    - docker compose version || apk add --no-cache docker-cli-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - cp deployment/.env.example deployment/.env
  script:
    - cd deployment
    - docker compose build backend web
    - docker compose push backend web
    # Zusaetzlich als `latest` — ein Deploy ohne IMAGE_TAG holt diese Marke. Nur umbenennen,
    # nicht ein zweites Mal bauen.
    - docker tag "$REGISTRY_IMAGE/backend:$IMAGE_TAG" "$REGISTRY_IMAGE/backend:latest"
    - docker tag "$REGISTRY_IMAGE/web:$IMAGE_TAG" "$REGISTRY_IMAGE/web:latest"
    - docker push "$REGISTRY_IMAGE/backend:latest"
    - docker push "$REGISTRY_IMAGE/web:latest"

# ---------------------------------------------------------------- deploy

# Bewusst manuell: vor dem 20.09. und waehrend der Anforderungsaenderung 21.-23.09. entscheidet ein Mensch.
# Der Runner laeuft auf derselben Maschine wie der Stack (sopro005 / 134.245.1.240). Der Job kopiert
# den Stand nach /deploy-target (das ist /home/stu250483/timetable auf sopro005) und baut dort —
# kein SSH, kein eigener deploy-Benutzer, kein Registry-Zugriff.
deploy:vm:
  stage: deploy
  # docker:cli statt alpine: Der Job braucht die Docker-Befehlszeile, um mit dem Daemon auf
  # sopro005 zu sprechen. Der Socket ist ueber die Runner-Konfiguration in den Job-Container
  # gemountet — ohne ihn gaebe es keinen Docker-Zugang.
  image: docker:27-cli
  rules:
    # Automatischer Deploy bei Versions-Tags nach dem Muster vX.Y.Z
    # (v1.0.0, v0.0.36, v2.3.14). Der Regex ist mit $ verankert, also matchen
    # Pre-Release-Tags wie v1.0.0-rc1 NICHT — die bleiben ohne Deploy.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success

    # Notausgang: auf main weiterhin manuell deploybar.
    # allow_failure: true ist Pflicht. Ohne dieses Flag gilt ein manueller Job in
    # `rules` als blockierend: die main-Pipeline bliebe auf "blocked".
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  variables:
    # Der Job laeuft auf demselben Rechner wie der Stack. Der Docker-Socket ist durchgereicht.
    DOCKER_HOST: "unix:///var/run/docker.sock"
  environment:
    name: vm-gruppe-5
    url: http://134.245.1.240:1500
  before_script:
    - apk add --no-cache rsync bash curl
    - |
      if [ ! -d /deploy-target ]; then
        echo "FEHLER: /deploy-target fehlt — Volume-Mount im Runner pruefen."
        exit 1
      fi
    - |
      if ! docker version > /dev/null 2>&1; then
        echo "FEHLER: kein Docker-Zugriff auf sopro005."
        exit 1
      fi
  script:
    # ---- 1. Repo nach /deploy-target spiegeln --------------------------------
    # Die Ausschluesse sind dieselben wie in scripts/deploy-vm.sh: .env (Passwoerter) und
    # backups/ liegen nur auf der VM, nicht im Checkout, und duerfen nicht durch --delete
    # verlorengehen. app/, docs/ und android-starter/ braucht der Stack nicht — das spart rund
    # 130 MB pro Deploy.
    #
    # Wichtig: die Ausschluesse haben einen fuehrenden Slash (/app, /docs, /android-starter).
    # Ohne ihn trifft rsync JEDES Verzeichnis dieses Namens auf jeder Ebene — also auch
    # frontend/src/app/, das der Web-Build zwingend braucht (TS2307, behoben 14.09.).
    #
    # Der rsync-Befehl steht in einem `|`-Block mit Backslash-Fortsetzung. Das ist robuster
    # als ein YAML-Plain-Scalar ueber mehrere Zeilen: eine verrutschte Einrueckung hatte am
    # 14.09. dafuer gesorgt, dass `rsync` als Argument von `echo` landete und gar nicht lief.
    - echo "==> Repo nach /deploy-target spiegeln"
    - |
      rsync -a --delete \
        --exclude .git --exclude node_modules \
        --exclude deployment/.env --exclude deployment/backups \
        --exclude /app --exclude /docs --exclude /android-starter \
        --exclude "**/build" --exclude "**/.gradle" --exclude "**/.demo-dist" \
        ./ /deploy-target/

    # ---- 2. .env anlegen oder auffuellen -------------------------------------
    # Beim ersten Lauf existiert .env nicht — dann aus .env.example erzeugen und die beiden
    # Geheimnisse aus den CI-Variablen eintragen. Bei spaeteren Laeufen bleibt die .env
    # unangetastet, damit ein Passwortwechsel auf der VM erhalten bleibt.
    - echo "==> deployment/.env vorbereiten"
    - |
      if [ ! -f /deploy-target/deployment/.env ]; then
        cp /deploy-target/deployment/.env.example /deploy-target/deployment/.env
        sed -i "s|^ADMIN_INITIAL_PASSWORD=.*|ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}|" /deploy-target/deployment/.env
        sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" /deploy-target/deployment/.env
        echo "    .env neu angelegt — Passwoerter aus CI-Variablen eingetragen."
      else
        echo "    .env vorhanden — unveraendert gelassen."
      fi

    # ---- 3. Stack neu bauen und starten --------------------------------------
    # Nacheinander statt `up -d --build`: BuildKit baut sonst Backend und Frontend gleichzeitig,
    # waehrend der alte Stack mit 512 + 1536 MB weiterlaeuft — auf einer 4-GB-VM der
    # wahrscheinlichste Grund fuer einen abgebrochenen Deploy.
    - echo "==> Backend bauen"
    - cd /deploy-target/deployment && docker compose build backend
    - echo "==> Frontend bauen"
    - docker compose build web
    - echo "==> Stack starten"
    - docker compose up -d
    - docker compose ps

    # ---- 4. Pruefen --------------------------------------------------------
    # Der Job laeuft in einem Runner-Container, der nur den Docker-Socket sieht. Sein
    # `localhost` ist NICHT die VM. Loesungen ueber `localhost` scheitern deshalb alle —
    # egal ob per curl, wget, `docker compose exec` oder `--net container:`.
    #
    # Wir starten stattdessen einen curl-Container IM selben Docker-Netz wie der Stack und
    # sprechen den Web-Service ueber seinen Compose-Service-Namen an ("web"). Die
    # eingebaute DNS-Aufloesung des Compose-Netzes macht daraus die richtige Container-IP,
    # und der Port ist der, auf dem nginx im Container lauscht (8080 — siehe
    # `docker compose ps` -> `0.0.0.0:8089->8080/tcp`).
    #
    # Vorherige Versuche (bis 14.09.): `curl localhost:$PORT` (falscher Host),
    # `docker compose exec -T web wget` (nginx-Log zeigt kein /api/health),
    # `docker run --net container:$WEB_ID` (Verbindung schlaegt fehl). Befund BETRIEB-11.
    - echo "==> Health-Pruefung"
    - |
      WEB_ID=$(docker compose ps -q web)
      NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$WEB_ID")
      echo "    Netzwerk: $NET"
      for i in $(seq 1 30); do
        if docker run --rm --network "$NET" curlimages/curl \
             -sf http://web:8080/api/health; then
          echo
          echo "==> OK"
          exit 0
        fi
        sleep 1
      done
      echo "FEHLER: /api/health antwortet nach 30 s nicht."
      docker compose logs --tail 100 backend || true
      docker compose logs --tail 100 web || true
      exit 1

android:release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["android:build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
  variables:
    PACKAGE_NAME: "android-app"
  script:
    - apk add --no-cache curl
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"
    - export APK_URL="${PKG_URL}/stundenplan-${VERSION}.apk"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file app/stundenplan.apk \
        "${APK_URL}"
    - |
      RELEASE_EXISTS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}")
      if [ "${RELEASE_EXISTS}" = "404" ]; then
        release-cli create \
          --tag-name "${CI_COMMIT_TAG}" \
          --name "Release ${CI_COMMIT_TAG}" \
          --description "Automatisches Release für ${CI_COMMIT_TAG}" \
          --assets-link "{\"name\":\"Android APK (stundenplan-${VERSION}.apk)\",\"url\":\"${APK_URL}\",\"link_type\":\"package\"}"
      else
        release-cli create \
          --tag-name "${CI_COMMIT_TAG}" \
          --assets-link "{\"name\":\"Android APK (stundenplan-${VERSION}.apk)\",\"url\":\"${APK_URL}\",\"link_type\":\"package\"}"
      fi